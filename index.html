<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>我的柴犬</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fce4ec;--card:#fff;--text:#333;--sub:#999;--pink:#e91e63;--gold:#f59e0b;--purple:#7c4dff}
body.night{--bg:#1a1a2e;--card:#2a2a4a;--text:#e0e0f0;--sub:#888}
body.sunset{--bg:#ffe0b2;--card:#fff8e1;--text:#5d4037;--sub:#a1887f}
body.rain{--bg:#e3f2fd;--card:#fff;--text:#37474f;--sub:#90a4ae}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-tap-highlight-color:transparent}
.app{max-width:420px;width:100%;padding:16px 16px 50px}
.hug-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .4s}
.hug-overlay.active{display:flex;opacity:1}
.hug-dog{font-size:160px;animation:hugBreathe 2s ease-in-out infinite}
.hug-text{color:#fff;font-size:20px;margin:20px 0;opacity:.9;text-align:center;max-width:280px;line-height:1.5}
.hug-sub{color:rgba(255,255,255,.4);font-size:13px;cursor:pointer}
@keyframes hugBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
/* PERIOD MODE GLOBAL */
body.period-mode{background:color-mix(in srgb,var(--bg) 97%,#e91e63 3%)}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px;flex-wrap:wrap}
.level-info{font-size:13px;color:var(--sub)}.level-bar{height:4px;background:rgba(0,0,0,.06);border-radius:2px;overflow:hidden;margin-bottom:10px}
.level-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:2px;transition:width .5s}

/* DOG CANVAS */
.dog-canvas{position:relative;width:200px;height:200px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.dog-base{font-size:130px;position:relative;z-index:1;transition:transform .2s}
.dog-base.bounce{animation:bounce .4s ease}.dog-base.wag{animation:wag .3s ease}.dog-base.happy{animation:happy .6s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-20px)}60%{transform:translateY(-6px)}}
@keyframes wag{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes happy{0%{transform:scale(1)}30%{transform:scale(1.08) rotate(-4deg)}60%{transform:scale(1.05) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
.acc-item{position:absolute;pointer-events:none;transform:translate(-50%,-50%);transition:all .3s}
.mood-text{font-size:12px;color:var(--sub);text-align:center;margin-top:4px;height:18px}
.bubble{background:var(--card);border-radius:18px;padding:12px 18px;font-size:14px;color:var(--text);box-shadow:0 2px 12px rgba(0,0,0,.06);margin:10px 0;display:none;animation:popIn .4s ease;line-height:1.6;text-align:center}
.bubble.show{display:block}
@keyframes popIn{0%{opacity:0;transform:scale(.8) translateY(8px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.stats{display:flex;justify-content:center;gap:18px;margin:8px 0;font-size:12px;color:var(--sub)}
.stat{display:flex;align-items:center;gap:4px}.stat-v{font-weight:700;color:var(--pink)}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.btn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid rgba(0,0,0,.06);font-size:20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.btn:active{transform:scale(.85)}.btn .badge{position:absolute;top:-4px;right:-4px;background:var(--pink);color:#fff;font-size:9px;border-radius:8px;padding:1px 5px;min-width:16px;text-align:center}
.big-btn{display:block;width:100%;padding:14px;border-radius:16px;color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;margin:6px 0;background:linear-gradient(135deg,var(--pink),var(--gold))}.big-btn:active{opacity:.8}
.big-btn.outline{background:var(--card);color:var(--text);border:1.5px solid rgba(0,0,0,.08)}
.page{display:none}.page.active{display:block}

/* PERIOD PAGE */
.period-header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(233,30,99,0.12);margin-bottom:12px}
.period-title{font-size:18px;font-weight:700;color:var(--pink)}
.period-status{font-size:12px;padding:4px 10px;border-radius:12px;background:rgba(233,30,99,0.1);color:var(--pink)}
.period-tabs{display:flex;gap:0;margin-bottom:14px;background:rgba(0,0,0,.04);border-radius:12px;padding:3px}
.period-tab{flex:1;text-align:center;padding:8px 4px;font-size:13px;border-radius:10px;cursor:pointer;transition:all .2s;color:var(--sub);font-weight:500}
.period-tab.active{background:var(--card);color:var(--pink);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.period-tab.care-highlight{color:#e91e63;font-weight:700}
/* Calendar */
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:15px;font-weight:600}
.cal-nav button{background:none;border:none;font-size:18px;cursor:pointer;padding:4px 10px;border-radius:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:10px}
.cal-head{font-size:11px;color:var(--sub);padding:6px 0;font-weight:600}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:50%;cursor:pointer;position:relative;transition:all .15s}
.cal-day:hover{background:rgba(0,0,0,.05)}
.cal-day.today{border:2px solid var(--pink);font-weight:700}
.cal-day.period-day{background:var(--pink);color:#fff}
.cal-day.predict-day{background:rgba(233,30,99,0.15)}
.cal-day.ovulation-day{background:rgba(33,150,243,0.10)}
.cal-day.other-month{color:var(--sub);opacity:.4}
/* Mood/Pain */
.mood-row{display:flex;gap:8px;justify-content:center;margin:12px 0}
.mood-btn{font-size:28px;cursor:pointer;padding:6px;border-radius:12px;border:2px solid transparent;transition:all .15s;background:var(--card)}
.mood-btn.selected{border-color:var(--pink);background:rgba(233,30,99,0.06);transform:scale(1.1)}
.pain-row{display:flex;gap:6px;justify-content:center;margin:10px 0}
.pain-btn{padding:8px 14px;border-radius:16px;font-size:12px;background:var(--card);border:2px solid rgba(0,0,0,.06);cursor:pointer;color:var(--sub)}
.pain-btn.selected{border-color:var(--pink);color:var(--pink);background:rgba(233,30,99,0.06)}
.mini-chart{display:flex;align-items:flex-end;gap:4px;height:60px;padding:8px 0;border-top:1px solid rgba(0,0,0,.05);margin-top:10px}
.chart-bar{flex:1;border-radius:4px 4px 0 0;min-height:4px;background:linear-gradient(to top,#e91e63,#f48fb1);position:relative;transition:height .3s}
.chart-bar .pain-dots{position:absolute;top:-4px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.chart-dot{width:5px;height:5px;border-radius:50%;background:rgba(233,30,99,0.5)}
/* Care cards */
.care-card{background:linear-gradient(135deg,rgba(233,30,99,0.06),rgba(233,30,99,0.02));border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid rgba(233,30,99,0.1)}
.care-card h3{font-size:15px;margin-bottom:8px;color:var(--pink)}
.care-msg{font-size:15px;line-height:1.6;color:var(--text);margin-bottom:10px}
.care-tip{font-size:13px;color:var(--text);background:var(--card);padding:10px 12px;border-radius:10px;margin-bottom:8px}
.care-action{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.04)}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px;border-bottom:1px solid rgba(0,0,0,.04)}
.todo-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--pink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.todo-check.done{background:var(--pink);color:#fff}
/* Settings */
.set-group{margin-bottom:16px}
.set-label{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.set-tags{display:flex;flex-wrap:wrap;gap:6px}
.set-tag{padding:5px 12px;border-radius:16px;font-size:12px;background:var(--card);border:1.5px solid rgba(0,0,0,.08);cursor:pointer;transition:all .15s}
.set-tag.selected{border-color:var(--pink);background:rgba(233,30,99,0.08);color:var(--pink)}
.set-radio{display:flex;gap:12px;flex-wrap:wrap}
.set-radio label{font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer}
.set-input{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid rgba(0,0,0,.08);font-size:14px;background:var(--card);color:var(--text);outline:none}
.set-input:focus{border-color:var(--pink)}
.danger-btn{background:#ff4444!important;color:#fff!important;margin-top:20px}

/* Effects */
.hearts{position:fixed;pointer-events:none;z-index:20}
.heart{position:absolute;font-size:24px;animation:floatUp 1.5s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-150px) scale(.3) rotate(20deg)}}
.confetti{position:fixed;font-size:20px;pointer-events:none;z-index:30;animation:cFall 2s ease-out forwards}
@keyframes cFall{0%{opacity:1;transform:translate(0,-20px) rotate(0)}100%{opacity:0;transform:translate(var(--cx),100vh) rotate(var(--cr))}}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:var(--card);border-radius:20px;padding:24px;text-align:center;max-width:300px;width:90%;animation:popIn .4s ease}
.modal-box h2{font-size:30px;margin-bottom:8px}.modal-box p{color:var(--sub);font-size:14px;margin-bottom:14px;line-height:1.6}
.modal-box button{padding:10px 28px;background:var(--pink);color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer}
.falling-bone{position:fixed;pointer-events:auto;z-index:999;cursor:pointer;animation:boneFall linear forwards}
@keyframes boneFall{0%{transform:translateY(-30px)}100%{transform:translateY(105vh)}}
.polaroid-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:150;display:none;align-items:center;justify-content:center}
.polaroid-overlay.active{display:flex}
.polaroid-card{background:#fffdf7;padding:20px 20px 50px;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.2);text-align:center;max-width:280px;width:85%;animation:polaroidIn .5s ease}
@keyframes polaroidIn{0%{opacity:0;transform:scale(.5) rotate(-10deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
.polaroid-dog{font-size:100px;margin-bottom:8px}.polaroid-dog img.dog-photo{width:120px;height:120px;border-radius:16px;object-fit:cover}
.polaroid-msg{font-size:15px;color:#555;margin:8px 0;line-height:1.5;font-family:Georgia,serif;font-style:italic}
.polaroid-date{font-size:11px;color:#bbb;margin-top:6px}
.polaroid-actions{display:flex;gap:12px;justify-content:center;margin-top:16px}
.polaroid-btn{padding:10px 20px;border-radius:20px;border:none;font-size:14px;cursor:pointer;color:#fff}
.polaroid-btn.save{background:var(--pink)}.polaroid-btn.close{background:#999}
.rain-drop{position:fixed;font-size:14px;pointer-events:none;z-index:1;animation:rDrop linear forwards}
@keyframes rDrop{0%{transform:translateY(-20px);opacity:.6}100%{transform:translateY(105vh);opacity:0}}
.snow-flake{position:fixed;font-size:16px;pointer-events:none;z-index:1;animation:sFall linear forwards}
@keyframes sFall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(105vh) rotate(360deg)}}
.sun-beam{position:fixed;font-size:20px;pointer-events:none;z-index:1;animation:sBeam linear forwards}
@keyframes sBeam{0%{opacity:0;transform:translateY(-20px)}30%{opacity:.5}100%{opacity:0;transform:translateY(105vh)}}
@keyframes floatScore{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}50%{transform:scale(1.2) translate(-50%,-80%)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
/* ONBOARDING */
.onboard-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center}
.onboard-overlay.active{display:flex}
.onboard-card{background:var(--card);border-radius:24px;padding:24px 20px;text-align:center;max-width:300px;width:85%;animation:popIn .4s ease}
.onboard-emoji{font-size:60px;margin-bottom:8px}
.onboard-title{font-size:18px;font-weight:700;margin-bottom:6px;color:var(--text)}
.onboard-desc{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.6;white-space:pre-line}
.onboard-dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.onboard-dot{width:8px;height:8px;border-radius:50%;background:#ddd;transition:all .3s}
.onboard-dot.cur{background:var(--pink);width:24px;border-radius:4px}
.onboard-btn{padding:12px 32px;border-radius:20px;background:var(--pink);color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer}
.onboard-skip{color:var(--sub);font-size:12px;margin-top:10px;cursor:pointer}
</style>
</head>
<body id="body">
<div class="hug-overlay" id="hugOverlay" onclick="M.Hug.end()"><div class="hug-dog" id="hugDogEl">🐕</div><div class="hug-text" id="hugTextEl"></div><div class="hug-sub">轻触退出</div></div>
<div class="app">
<div class="header"><div class="level-info" id="levelInfo">Lv1</div>
<div style="display:flex;gap:8px;align-items:center">
<span style="font-size:11px;color:var(--sub);cursor:pointer" onclick="M.Rename.show()" title="改名">✏️ <span id="dogNameDisplay">柴犬</span></span>
<button class="btn" style="width:28px;height:28px;font-size:14px" onclick="M.Rename.toggleBreedLock()" id="breedLockBtn" title="锁定品种">🔓</button>
<button class="btn" style="width:36px;height:36px;font-size:16px" onclick="UI.page('home')">🏠</button>
<button class="btn" style="width:36px;height:36px;font-size:16px" onclick="UI.page('wardrobe')">👗</button>
<button class="btn" style="width:36px;height:36px;font-size:16px" onclick="UI.page('collection')">📔</button>
</div></div>
<div class="level-bar"><div class="level-fill" id="levelBar" style="width:0%"></div></div>

<!-- HOME -->
<div class="page active" id="pageHome">
<div class="dog-canvas" id="dogCanvas">
  <div class="dog-base" id="dogBase" onpointerdown="Input.down(event)" onpointerup="Input.up(event)" onpointerleave="Input.up(event)">🐕</div>
</div>
<div class="mood-text" id="moodText"></div>
<div class="hint" id="hugHint" style="font-size:11px;color:var(--sub);text-align:center;margin-top:2px">长按柴犬 2 秒，给它一个抱抱 🤗</div>
<div class="bubble" id="bubbleEl"></div>
<div class="stats"><div class="stat">❤️ <span class="stat-v" id="sAffection">0</span></div><div class="stat">🦴 <span class="stat-v" id="sTreats">3</span></div><div class="stat">📅 <span class="stat-v" id="sDays">1</span>天</div><div class="stat">🔥 <span class="stat-v" id="sStreak">1</span></div></div>
<div class="actions">
<button class="btn" onclick="M.Feed.run(event)"><span class="badge" id="treatBadge">3</span>🍖</button>
<button class="btn" onclick="M.Game.toggle()" id="gameBtn">🎮</button>
<button class="btn" onclick="M.Game.toggleDifficulty()" title="切换难度" style="font-size:11px;">⚙</button>
<button class="btn" onclick="M.Love.run()">💌</button>
<button class="btn" onclick="M.Polaroid.open()">📸</button>
<button class="btn" onclick="M.Theme.cycle()">🎨</button>
<button class="btn" onclick="M.Audio.toggle()" id="musicBtn">🔊</button>
<button class="btn" onclick="M.Share.run()" title="分享">🔗</button>
<button class="btn" onclick="M.Feedback.show()" title="反馈">💬</button>
<button class="btn" onclick="M.MusicBox.toggle()" title="点歌台">🎵</button>
<button class="btn" onclick="M.Water.drink()" title="喝水提醒">💧</button>
<button class="btn" onclick="UI.page('period')" title="经期关怀" id="periodBtn"><span class="badge" id="periodBadge"></span>🌸</button>
</div>
<button class="big-btn checkin-btn" id="checkinBtn" onclick="M.Checkin.run()">🎁 每日签到</button>
<button class="big-btn gacha-btn" onclick="M.Gacha.run()">🎰 抽卡 (5🦴)</button>
</div>

<!-- WARDROBE -->
<div class="page" id="pageWardrobe"><div style="font-weight:600;margin-bottom:6px">👗 全身装扮</div>
<div class="outfit-section" id="outfitPresets"></div>
<button class="big-btn outline" style="margin:4px 0;font-size:13px" onclick="M.Wardrobe.undressAll()">👙 一键卸下全部</button>
<div class="wardrobe-grid" id="wardrobeGrid"></div>
<button class="big-btn outline" onclick="UI.page('home')">← 返回</button></div>

<!-- COLLECTION -->
<div class="page" id="pageCollection"><div style="font-weight:600;margin-bottom:10px">📔 收藏册</div>
<div class="wardrobe-grid" id="collectionGrid"></div>
<button class="big-btn outline" onclick="UI.page('home')">← 返回</button></div>

<!-- PERIOD -->
<div class="page" id="pagePeriod">
<div class="period-header">
  <div class="period-title" id="periodTitle">🌸 经期关怀</div>
  <div class="period-status" id="periodStatus">未设置</div>
</div>
<div class="period-tabs">
  <div class="period-tab active" onclick="M.Period.switchTab('cal')">📅 日历</div>
  <div class="period-tab" onclick="M.Period.switchTab('log')">📝 记录</div>
  <div class="period-tab" id="careTab" onclick="M.Period.switchTab('care')">💕 关怀</div>
  <div class="period-tab" onclick="M.Period.switchTab('set')">⚙ 设置</div>
</div>
<div id="periodContent"></div>
<button class="big-btn outline" onclick="UI.page('home')">← 返回</button>
</div>
</div>

<div class="hearts" id="heartsEl"></div><div class="toast" id="toastEl"></div>
<div class="modal" id="modalEl" onclick="if(event.target===this)this.classList.remove('show')"><div class="modal-box"><h2 id="modalIcon"></h2><p id="modalMsg"></p><button onclick="document.getElementById('modalEl').classList.remove('show')">知道啦 ✨</button></div></div>

<!-- FEEDBACK -->
<div class="modal" id="feedbackModal" onclick="if(event.target===this)M.Feedback.hide()"><div class="modal-box" style="max-width:340px;text-align:left">
<h2 style="text-align:center;margin-bottom:4px">💬 告诉我你的想法</h2><p style="text-align:center;color:var(--sub);font-size:12px;margin-bottom:14px">柴犬想听听你的意见～</p>
<div style="display:flex;justify-content:center;gap:12px;margin-bottom:14px" id="emojiRating">
<span style="font-size:36px;cursor:pointer;transition:all .2s;opacity:.4" onclick="M.Feedback.rate(5,this)">😍</span>
<span style="font-size:36px;cursor:pointer;transition:all .2s;opacity:.4" onclick="M.Feedback.rate(4,this)">😊</span>
<span style="font-size:36px;cursor:pointer;transition:all .2s;opacity:.4" onclick="M.Feedback.rate(3,this)">😐</span>
<span style="font-size:36px;cursor:pointer;transition:all .2s;opacity:.4" onclick="M.Feedback.rate(2,this)">😕</span>
<span style="font-size:36px;cursor:pointer;transition:all .2s;opacity:.4" onclick="M.Feedback.rate(1,this)">😢</span>
</div>
<textarea id="feedbackText" placeholder="还有什么想说的？（选填）" style="width:100%;height:60px;background:var(--bg);border:1px solid rgba(0,0,0,.08);border-radius:10px;padding:10px;font-size:13px;color:var(--text);outline:none;resize:none;font-family:inherit"></textarea>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="polaroid-btn close" onclick="M.Feedback.hide()" style="flex:1">取消</button>
<button class="polaroid-btn save" onclick="M.Feedback.submit()" style="flex:1">提交 💌</button>
</div></div></div>

<!-- MUSIC BOX -->
<div class="modal" id="musicModal" onclick="if(event.target===this)M.MusicBox.hide()">
<div class="modal-box" style="max-width:340px">
<h2>🎵 柴犬点歌台</h2><p style="color:var(--sub);font-size:11px;margin:4px 0 12px">选一首，柴犬跟着跳～</p>
<div id="musicList" style="text-align:left"></div>
<div id="nowPlaying" style="font-size:11px;color:var(--pink);margin-top:8px;display:none"></div>
<div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
<button class="polaroid-btn close" onclick="M.MusicBox.stop()" style="flex:1">⏹</button>

<script>
// ==================== STORE ====================
const S={key:'shiba_v6',d:null,
  init(){this.d=JSON.parse(localStorage.getItem(this.key)||'{"treats":3,"affection":0,"level":0,"pets":0,"days":1,"streak":1,"lastCheckin":"","equipped":{},"collection":{},"highScore":0,"firstOpen":"'+new Date().toISOString()+'","music":true,"owned":{},"onboarded":false,"dogName":"柴犬","breedLock":false,"period":{"history":[],"current":null,"prefs":{"cycleDays":28,"flowDays":5,"nickname":"","favoriteSnacks":[],"comfortFood":[],"musicStyle":"gentle","loveLanguage":"words","painLevel":"medium","symptoms":[]},"dailyLog":{},"carePushed":{}}}');this.save()},
  save(){localStorage.setItem(this.key,JSON.stringify(this.d))},
  get(k){return this.d[k]},set(k,v){this.d[k]=v;this.save()},add(k,n){this.d[k]=(this.d[k]||0)+n;this.save()},
}

// ==================== AUDIO ====================
const Audio={ctx:null,
  init(){document.addEventListener('click',()=>{if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()},{once:true})},
  _safe(fn){if(!S.get('music'))return;try{if(!this.ctx||this.ctx.state==='suspended')this.ctx?.resume();fn(this.ctx)}catch(e){}},
  bark(){this._safe(c=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.setValueAtTime(500,c.currentTime);o.frequency.exponentialRampToValueAtTime(150,c.currentTime+.2);g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.25);o.start();o.stop(c.currentTime+.25)})},
  happy(){this._safe(c=>{[523,659,784].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.1,c.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.3+i*.12);o.start(c.currentTime+i*.12);o.stop(c.currentTime+.3+i*.12)})})},
  purr(){this._safe(c=>{for(let i=0;i<3;i++){setTimeout(()=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=60+Math.random()*20;g.gain.setValueAtTime(.04,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.5);o.start();o.stop(c.currentTime+1.5)},i*500)}})},
  toggle(){S.set('music',!S.get('music'));UI.update()},
}

// ==================== FX ====================
const FX={
  hearts(n){const hc=document.getElementById('heartsEl'),e=['💕','💖','✨','🌸','💝'];const canvas=document.getElementById('dogCanvas'),rect=canvas.getBoundingClientRect();const cx=rect.left+rect.width/2,cy=rect.top+rect.height/3;
    for(let i=0;i<n;i++)setTimeout(()=>{const h=document.createElement('span');h.className='heart';h.textContent=e[Math.floor(Math.random()*e.length)];h.style.left=(cx+Math.random()*120-60)+'px';h.style.top=(cy+Math.random()*60-20)+'px';h.style.animationDuration=(1+Math.random()*1.5)+'s';hc.appendChild(h);setTimeout(()=>h.remove(),1800)},i*50)},
  confetti(){const e=['🎉','🎊','✨','🌟','💫','🌸'];for(let i=0;i<25;i++)setTimeout(()=>{const c=document.createElement('span');c.className='confetti';c.textContent=e[Math.floor(Math.random()*e.length)];c.style.left=Math.random()*100+'%';c.style.setProperty('--cx',(Math.random()*200-100)+'px');c.style.setProperty('--cr',(Math.random()*720-360)+'deg');document.body.appendChild(c);setTimeout(()=>c.remove(),2200)},i*25)},
  bubble(msg){const b=document.getElementById('bubbleEl');b.classList.remove('show');void b.offsetWidth;b.innerHTML=msg;b.classList.add('show')},
  toast(msg){const t=document.getElementById('toastEl');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)},
  modal(icon,msg){document.getElementById('modalIcon').textContent=icon;document.getElementById('modalMsg').innerHTML=msg.replace(/\n/g,'<br>');document.getElementById('modalEl').classList.add('show')},
}

const UI={

  update(){
    const a=S.get('affection'),reqs=[50,150,300,999],lvl=reqs.findIndex(r=>a<r);const cl=lvl<0?3:lvl,cpct=cl===3?100:cl===0?Math.round(a/reqs[0]*100):Math.round((a-reqs[cl-1])/(reqs[cl]-reqs[cl-1])*100)
    const names=['陌生柴犬','认识你啦','最喜欢你','永远陪你'],name=S.get('dogName')||'柴犬'
    const nextLvl=cl<3?reqs[cl]:999,remain=nextLvl-a,hint=cl<3?` 还差 ${remain} ❤️ 升级`:''
    document.getElementById('levelInfo').innerHTML='Lv'+(cl+1)+' '+names[cl]+' <span style="font-size:10px;color:var(--pink)">'+hint+'</span>'
    document.getElementById('levelBar').style.width=cpct+'%'
    document.getElementById('sAffection').textContent=a;document.getElementById('sTreats').textContent=S.get('treats');document.getElementById('sDays').textContent=S.get('days');document.getElementById('sStreak').textContent=S.get('streak');document.getElementById('treatBadge').textContent=S.get('treats');document.getElementById('musicBtn').textContent=S.get('music')?'🔊':'🔇';document.getElementById('dogNameDisplay').textContent=S.get('dogName')||'柴犬';document.getElementById('breedLockBtn').textContent=S.get('breedLock')?'🔒':'🔓'

    pb.textContent=badge;pb.style.display=badge?'':'none'
    // Period status
    const ps=document.getElementById('periodStatus');if(M.Period.isInPeriod()){ps.textContent='经期第 '+M.Period.daysIntoPeriod()+' 天';ps.style.display=''}else if(M.Period.daysUntilNext()>0&&M.Period.daysUntilNext()<=14){ps.textContent='距预测经期约 '+M.Period.daysUntilNext()+' 天';ps.style.display=''}
    // Period mode body class
    document.getElementById('body').classList.toggle('period-mode',M.Period.isInPeriod())
    const ct=document.getElementById('careTab');if(ct)ct.classList.toggle('care-highlight',M.Period.isInPeriod())
    // Period mode dialogue weighting
    UI.updateAccessories()
  },
}

// ==================== MODULES ====================
const M={
  Onboard:{
    steps:[
      {emoji:'🐕',title:'这是你的柴犬',desc:'点点它、摸摸它\n长按 2 秒还能给它一个抱抱 🤗'},
      {emoji:'🍖',title:'狗粮可以干很多事',desc:'喂食让柴犬开心\n攒够狗粮还能抽卡换装 👗'},
      {emoji:'🎁',title:'每天回来看看它',desc:'签到领奖励、接骨头玩游戏\n柴犬会一直陪着你 💕'},
    ],
    cur:0,
    start(){document.getElementById('onboardOverlay').classList.add('active');this.showStep(0)},
    showStep(i){
      this.cur=i;const s=this.steps[i]
      document.getElementById('obEmoji').textContent=s.emoji;document.getElementById('obTitle').textContent=s.title;document.getElementById('obDesc').textContent=s.desc
      for(let j=0;j<3;j++)document.getElementById('dot'+j).classList.toggle('cur',j===i)
      document.getElementById('obBtn').textContent=i===2?'开始吧 ✨':'下一步 →'
    },
    next(){if(this.cur<2)this.showStep(this.cur+1);else this.skip()},
    skip(){document.getElementById('onboardOverlay').classList.remove('active');S.set('onboarded',true)},
  },
  Dog:{
    tap(){
      S.add('pets',1);S.add('affection',1)
      const db=document.getElementById('dogBase')
      if(!S.get('breedLock')&&S.get('pets')%12===0){const cur=db.textContent,b=['🐕','🐶','🐩','🦮','🐕‍🦺'].filter(x=>x!==cur);if(b.length){db.textContent=b[Math.floor(Math.random()*b.length)];FX.toast('🐾 咦，柴犬交到了新朋友～')}}
      const inP=M.Period.isInPeriod()
      // Gentler animation during period
      if(inP){db.style.transform='scale(1.04) rotate('+(Math.random()*4-2)+'deg)';setTimeout(()=>db.style.transform='',300)}
      else{const anims=['bounce','wag','happy'];db.classList.add(anims[Math.floor(Math.random()*anims.length)]);setTimeout(()=>{db.classList.remove('bounce','wag','happy')},600)}
      // Period care messages
      if(inP&&Math.random()<.7){const msg=M.Period.getCareMessage();if(msg)FX.bubble(msg)}
      else{FX.bubble(Dialogues.idle[Math.floor(Math.random()*Dialogues.idle.length)])}
      FX.hearts(4+Math.floor(Math.random()*4));Audio.bark()
      if(Math.random()<.15){const cc=['🍓','🌼','🍀','⭐','🍬','❤️','🌸','💎','🎀','🦋'],c=cc[Math.floor(Math.random()*cc.length)],col=S.get('collection');col[c]=(col[c]||0)+1;S.set('collection',col);FX.toast('✨ 获得了 '+c)}
      UI.update();localStorage.setItem('shiba_last_active',Date.now())
      const a=S.get('affection'),reqs=[50,150,300,999],nl=reqs.findIndex(r=>a<r),nlvl=nl<0?3:nl
      if(nlvl>S.get('level')){S.set('level',nlvl);const msgs=['柴犬开始认识你了 💕','你们已经是好朋友啦 🤝','柴犬最喜欢你了！❤️','柴犬决定永远陪着你 🏠'];FX.modal('🎉','升级啦！\n\nLv'+(nlvl+1)+' '+['陌生柴犬','认识你啦','最喜欢你','永远陪你'][nlvl]+'\n\n'+msgs[nlvl]);FX.confetti();FX.hearts(20);Audio.happy()}
    },
  },
  Hug:{start(){document.getElementById('hugTextEl').textContent=Dialogues.hug_msgs[Math.floor(Math.random()*Dialogues.hug_msgs.length)];document.getElementById('hugOverlay').classList.add('active');document.getElementById('hugHint').style.display='none';S.set('onboarded',true);S.add('affection',2);UI.update();Audio.purr()},end(){document.getElementById('hugOverlay').classList.remove('active')}},
  Feed:{run(e){if(S.get('treats')<=0){FX.toast('🦴 狗粮不够！');return}S.add('treats',-1);S.add('affection',3);FX.bubble('好吃好吃！谢谢 🍖');FX.hearts(6);Audio.happy();UI.update()}},
  Love:{run(){
    const notes=M.Period.isInPeriod()?Dialogues.periodLoveNotes:Dialogues.love_notes
    FX.bubble('💌<br>'+notes[Math.floor(Math.random()*notes.length)]+'<br><span style=font-size:11px;color:#ccc>——柴犬给你的小纸条</span>');FX.hearts(10);Audio.happy()
  }},
  Checkin:{run(){
    const today=new Date().toDateString();if(S.get('lastCheckin')===today){FX.toast('今天已经签到过啦！');return}
    const y=new Date(Date.now()-864e5).toDateString(),st=S.get('lastCheckin')===y?S.get('streak')+1:1;S.set('streak',st);S.set('lastCheckin',today);S.add('days',1)
    let b=3;if(st>=30)b=20;else if(st>=15)b=12;else if(st>=7)b=8;else if(st>=3)b=5;S.add('treats',b);S.add('affection',5)
    let extra='';const owned=S.get('owned')
    if(st===3){owned['bow_red']=true;extra=' 🎀 获得蝴蝶结！'}if(st===7){owned['hat_small']=true;extra=' 👒 获得小帽子！'}if(st===15){owned['crown']=true;extra=' 👑 获得皇冠！'}if(st===30){owned['glasses']=true;extra=' 🕶 获得墨镜！'}
    S.set('owned',owned);FX.modal('🎁','签到成功！\n\n+'+b+' 🦴'+extra+'\n\n连续 '+st+' 天！');FX.confetti();FX.hearts(12);Audio.happy();UI.update()
  }},
  Game:{active:false,timer:null,interval:null,score:0,combo:0,maxCombo:0,golden:false,easy:true,
    toggle(){this.active?this.stop():this.start()},
    start(){this.active=true;this.score=0;this.combo=0;this.maxCombo=0;this.golden=false;document.getElementById('gameBtn').textContent='⏹';const interval=this.easy?900:600,boneSize=this.easy?'44px':'28px',boneDur=this.easy?3.5:2;document.querySelectorAll('.actions .btn:not(#gameBtn),.big-btn').forEach(b=>{b.disabled=true;b.style.opacity='.3'});const o=document.createElement('div');o.id='gameOverlay';o.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;pointer-events:auto';o.onclick=e=>e.stopPropagation();document.body.appendChild(o);FX.toast('🎮 接骨头！'+(this.easy?' 简单模式':' 普通模式'));const self=this;this.interval=setInterval(()=>self.spawn(boneSize,boneDur),interval);this.timer=setTimeout(()=>this.stop(),25000);setTimeout(()=>{this.golden=true;FX.toast('🌟 金骨头！')},10000)},
    spawn(bs,bd){if(!this.active)return;const b=document.createElement('span'),isG=this.golden&&Math.random()<.2;b.textContent=isG?'🌟':'🍖';b.dataset.pts=isG?'3':'1';b.className='falling-bone';b.style.left=Math.random()*90+'%';b.style.fontSize=isG?'52px':bs;b.style.animationDuration=(isG?1.5:bd+Math.random()*2)+'s';b.onclick=e=>{e.stopPropagation();this.catch(b)};document.body.appendChild(b);setTimeout(()=>b.remove(),6000)},
    catch(bEl){if(!this.active)return;const pts=parseInt(bEl.dataset.pts||'1');this.combo++;if(this.combo>this.maxCombo)this.maxCombo=this.combo;let bonus=this.combo>=10?3:this.combo>=5?2:this.combo>=3?1:0;this.score+=pts+bonus;bEl.remove();FX.hearts(pts+bonus>1?5:3);Audio.happy();const s=document.createElement('div');s.textContent='+'+pts+bonus;s.style.cssText='position:fixed;top:50%;left:50%;font-size:40px;font-weight:700;color:#e91e63;pointer-events:none;z-index:200;animation:floatScore .8s ease-out forwards';document.body.appendChild(s);setTimeout(()=>s.remove(),900);clearTimeout(this._ct);this._ct=setTimeout(()=>{this.combo=0},1500)},
    stop(){this.active=false;clearTimeout(this.timer);clearInterval(this.interval);clearTimeout(this._ct);document.getElementById('gameBtn').textContent='🎮';document.querySelectorAll('.actions .btn,.big-btn').forEach(b=>{b.disabled=false;b.style.opacity=''});const o=document.getElementById('gameOverlay');if(o)o.remove();if(this.score>0){const r=Math.floor(this.score/5);S.add('treats',Math.min(r,99));if(this.score>S.get('highScore'))S.set('highScore',this.score);FX.modal('🎯','得分 '+this.score+' | 连击 '+this.maxCombo+'x\n+'+r+' 🦴');UI.update()}this.combo=0;this.maxCombo=0},
    toggleDifficulty(){this.easy=!this.easy;FX.toast(this.easy?'🎮 简单模式（更大更慢）':'🎮 普通模式')},
  },
  Gacha:{pity:0,
      run(){
        if(S.get('treats')<5){FX.toast('需要 5🦴');return}
        S.add('treats',-5);this.pity++
        const isPity=this.pity>=20
        const pool=[{r:'SSR',t:'🌟',m:'限定皇冠！',a:'crown',p:isPity?100:5},{r:'SR',t:'💫',m:'狗粮包 +10',p:15},{r:'SR',t:'🎀',m:'稀有蝴蝶结',a:'bow_red',p:15},{r:'R',t:'🍖',m:'狗粮 +5',p:30},{r:'R',t:'🕶',m:'墨镜',a:'glasses',p:15},{r:'N',t:'🦴',m:'狗粮 +2',p:20}]
        const rand=Math.random()*100;let cum=0,prize=pool[pool.length-1]
        for(const p of pool){cum+=p.p;if(rand<cum){prize=p;break}}
        if(prize.r==='SSR')this.pity=0
        if(prize.a){const o=S.get('owned');o[prize.a]=true;S.set('owned',o)}
        let msg=prize.t+' '+prize.r+'!\n'+prize.m
        if(!isPity)msg+='\n\n📊 概率: SSR 5% | SR 30% | R 45% | N 20%'

  // ==================== PERIOD CARE MODULE ====================
  Period:{

    // --- Calendar ---
    renderCal(){
      const now=new Date(),year=this._calY||now.getFullYear(),month=(this._calM||now.getMonth())+1
      this._calY=year;this._calM=month-1
      const prefs=S.get('period').prefs,period=S.get('period')
      const firstDay=new Date(year,month-1,1).getDay(),lastDate=new Date(year,month,0).getDate()
      const today=this.todayStr()
      // Compute period days and prediction
      const periodDays=new Set()
      period.history.forEach(h=>{const s=new Date(h.startDate),e=new Date(h.endDate||h.startDate);for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');periodDays.add(ds)}})
      if(period.current){const s=new Date(period.current.startDate),e=period.current.endDate?new Date(period.current.endDate):new Date();for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');periodDays.add(ds)}}
      // Predict next
      let predictDays=new Set(),ovDays=new Set()
      if(period.history.length){const last=period.history[period.history.length-1];const nextStart=new Date(last.startDate);nextStart.setDate(nextStart.getDate()+prefs.cycleDays);for(let i=0;i<prefs.flowDays;i++){const d=new Date(nextStart);d.setDate(d.getDate()+i);const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');predictDays.add(ds)}
        const ovDay=new Date(nextStart);ovDay.setDate(ovDay.getDate()-14);for(let i=-2;i<=2;i++){const d=new Date(ovDay);d.setDate(d.getDate()+i);const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');ovDays.add(ds)}}

      calHTML+='<div class="cal-grid">'+['日','一','二','三','四','五','六'].map(d=>'<div class="cal-head">'+d+'</div>').join('')

      if(this.isInPeriod()){status='经期第 '+this.daysIntoPeriod()+' / '+prefs.flowDays+' 天';hint='记得多喝热水哦～'}
      else if(this.daysUntilNext()>=0){status='距下次经期约 '+this.daysUntilNext()+' 天';hint='今天要对她好一点 💕'}
      else{status='未设置记录';hint='点击日期开始记录'}

    renderCare(){
      let html='<div class="care-card"><h3>🐕 柴犬对她说</h3><div class="care-msg">'+this.getCareMessage()+'</div>'
      html+='<h3 style="margin-top:12px">💡 今日建议</h3>'+this.getTodayTips().map(t=>'<div class="care-tip">'+t+'</div>').join('')
      html+='<h3 style="margin-top:12px">🎵 推荐做的事</h3>'
      const actions=['一起看一部温馨的电影 🎬','给她揉揉肚子','准备一杯热红糖姜茶 🍵','帮她捂暖手心和脚心 🤲','放一首她喜欢的歌 🎧','讲一个冷笑话逗她笑','帮她按摩肩膀和后腰 💆','准备一个小惊喜','安静地陪着她 🤗','帮她热一下暖宝宝 🌡️']
      for(let i=0;i<3;i++)html+='<div class="care-action">✨ '+actions[Math.floor(Math.random()*actions.length)]+'</div>'
      html+='</div>'
      
      // Boyfriend view
      html+='<div class="care-card" style="margin-top:8px;border-color:rgba(245,158,11,0.2);background:linear-gradient(135deg,rgba(245,158,11,0.06),rgba(245,158,11,0.02))"><h3 style="color:#f59e0b">⚠️ 男友待办</h3>'
      const todos=this.isInPeriod()?this.getTodoList('during'):(this.daysUntilNext()<=3&&this.daysUntilNext()>0?this.getTodoList('before'):'')
      if(typeof todos==='string'){html+='<p style="font-size:13px;color:var(--sub)">经期不在范围内，暂无待办</p>'}
      else{todos.forEach((t,i)=>{const ck=(S.get('period').carePushed||{})['todo_'+i]||false;html+='<div class="todo-item"><div class="todo-check'+(ck?' done':'')+'" onclick="M.Period._toggleTodo('+i+')">'+(ck?'✓':'')+'</div>'+t+'</div>'})}
      html+='</div>'
      return html
    },
    _toggleTodo(i){const p=S.get('period'),cp=p.carePushed||{};cp['todo_'+i]=!cp['todo_'+i];p.carePushed=cp;S.set('period',p);this.render()},
    
    // --- Settings ---
    renderSet(){
      const prefs=S.get('period').prefs
      let html='<div class="set-group"><div class="set-label">她的昵称</div><input class="set-input" id="setNick" value="'+(prefs.nickname||'')+'" placeholder="如：宝贝" onchange="M.Period._saveSet()"></div>'
      html+='<div class="set-group"><div class="set-label">周期天数</div><input class="set-input" type="number" id="setCycle" value="'+prefs.cycleDays+'" onchange="M.Period._saveSet()" style="width:80px"></div>'
      html+='<div class="set-group"><div class="set-label">经期持续天数</div><input class="set-input" type="number" id="setFlow" value="'+prefs.flowDays+'" onchange="M.Period._saveSet()" style="width:80px"></div>'
      html+='<div class="set-group"><div class="set-label">痛经程度</div><div class="set-radio">'+[{v:'light',t:'轻微'},{v:'medium',t:'中等'},{v:'heavy',t:'较重'}].map(o=>'<label><input type="radio" name="painLevel" value="'+o.v+'" onchange="M.Period._saveSet()" '+(prefs.painLevel===o.v?'checked':'')+'>'+o.t+'</label>').join('')+'</div></div>'
      html+='<div class="set-group"><div class="set-label">常见症状</div><div class="set-tags">'+[{v:'cramps',t:'痛经'},{v:'bloating',t:'腹胀'},{v:'fatigue',t:'疲劳'},{v:'moodSwings',t:'情绪波动'},{v:'headache',t:'头痛'},{v:'backache',t:'腰酸'}].map(o=>'<div class="set-tag'+(prefs.symptoms.includes(o.v)?' selected':'')+'" onclick="M.Period._toggleSymptom(\''+o.v+'\')">'+o.t+'</div>').join('')+'</div></div>'
      html+='<div class="set-group"><div class="set-label">爱的语言</div><div class="set-radio">'+[{v:'words',t:'暖心话 💬'},{v:'acts',t:'实际行动 💪'},{v:'gifts',t:'小礼物 🎁'},{v:'touch',t:'陪伴就好 🤗'}].map(o=>'<label><input type="radio" name="loveLang" value="'+o.v+'" onchange="M.Period._saveSet()" '+(prefs.loveLanguage===o.v?'checked':'')+'>'+o.t+'</label>').join('')+'</div></div>'
      html+='<button class="big-btn outline" onclick="M.Period._exportData()">📋 导出数据</button>'
      html+='<button class="big-btn danger-btn" onclick="if(confirm(\'确定要删除所有经期数据吗？此操作不可恢复！\'))M.Period._clearData()">🗑 清除所有经期数据</button>'
      return html
    },
    _saveSet(){const prefs=S.get('period').prefs;const n=document.getElementById('setNick')?.value;if(n!==undefined)prefs.nickname=n;const cy=document.getElementById('setCycle')?.value;if(cy)prefs.cycleDays=parseInt(cy)||28;const fl=document.getElementById('setFlow')?.value;if(fl)prefs.flowDays=parseInt(fl)||5;const pl=document.querySelector('input[name="painLevel"]:checked');if(pl)prefs.painLevel=pl.value;const ll=document.querySelector('input[name="loveLang"]:checked');if(ll)prefs.loveLanguage=ll.value;S.get('period').prefs=prefs;S.save()},
    _toggleSymptom(v){const prefs=S.get('period').prefs,s=prefs.symptoms,i=s.indexOf(v);i>=0?s.splice(i,1):s.push(v);prefs.symptoms=s;S.get('period').prefs=prefs;S.save();this.render()},
    _exportData(){const data=S.get('period');const a=document.createElement('a');a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2));a.download='period_data_'+this.todayStr()+'.json';a.click();FX.toast('📋 数据已导出')},
    _clearData(){S.set('period',{history:[],current:null,prefs:{cycleDays:28,flowDays:5,nickname:'',favoriteSnacks:[],comfortFood:[],musicStyle:'gentle',loveLanguage:'words',painLevel:'medium',symptoms:[]},dailyLog:{},carePushed:{}});FX.toast('🗑 数据已清除');UI.update();this.render()},
    
    // --- Render ---
    render(){
      const el=document.getElementById('periodContent');let html=''
      if(this.activeTab==='cal')html=this.renderCal()
      else if(this.activeTab==='log')html=this.renderLog()
      else if(this.activeTab==='care')html=this.renderCare()
      else if(this.activeTab==='set')html=this.renderSet()
      el.innerHTML=html
      UI.update()
    },
    
    // --- Init ---
    checkAndNotify(){
      const dn=this.daysUntilNext(),today=this.todayStr(),period=S.get('period')
      if(dn>=0&&dn<=3&&!(period.carePushed[today]||{}).preWarn){period.carePushed[today]={...period.carePushed[today],preWarn:true};S.set('period',period);FX.toast('🌸 她的经期快到了，准备好红糖姜茶～')}
      else if(dn===0&&!(period.carePushed[today]||{}).day1){period.carePushed[today]={...period.carePushed[today],day1:true};S.set('period',period);FX.modal('🌸','今天可能是她经期的第一天哦\n记得对她格外温柔～')}
    }
  },
}

// IDLE ANIMATION
setInterval(()=>{if(!M.Game.active&&!document.getElementById('hugOverlay').classList.contains('active')){const db=document.getElementById('dogBase');if(Math.random()<.4){db.classList.add('wag');setTimeout(()=>db.classList.remove('wag'),300);if(Math.random()<.3)FX.bubble(Dialogues.idle[Math.floor(Math.random()*Dialogues.idle.length)])}}},10000)

// INIT
S.init();Audio.init();UI.update();M.Water.init();M.Period.checkAndNotify()
if(!S.get('onboarded'))setTimeout(()=>M.Onboard.start(),600)
const last=parseInt(localStorage.getItem('shiba_last_active')||'0'),away=Math.floor((Date.now()-last)/3600000)
if(away>=2){const n=S.get('dogName')||'柴犬';setTimeout(()=>FX.bubble(n+'一直在等你 💕，你离开了 '+away+' 小时'),1500)}
localStorage.setItem('shiba_last_active',Date.now())
</script>
</body>
</html>
