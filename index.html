<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>我的柴犬</title>
<style>
/* ====== BASE ====== */
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fce4ec;--card:#fff;--text:#333;--sub:#999;--pink:#e91e63;--gold:#f59e0b;--purple:#7c4dff}
body.night{--bg:#1a1a2e;--card:#2a2a4a;--text:#e0e0f0;--sub:#888}
body.sunset{--bg:#ffe0b2;--card:#fff8e1;--text:#5d4037;--sub:#a1887f}
body.rain{--bg:#e3f2fd;--card:#fff;--text:#37474f;--sub:#90a4ae}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);
  min-height:100dvh;overflow-x:hidden;transition:background .8s;
  display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-tap-highlight-color:transparent}
.app{max-width:420px;width:100%;padding:16px}

/* ====== HUG OVERLAY ====== */
.hug-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);
  z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center}
.hug-overlay.active{display:flex}
.hug-dog{font-size:160px;animation:hugBreathe 2s ease-in-out infinite}
.hug-text{color:#fff;font-size:20px;margin:20px 0;opacity:.9;text-align:center;max-width:280px;line-height:1.5}
.hug-sub{color:rgba(255,255,255,.4);font-size:13px;cursor:pointer}
@keyframes hugBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ====== HEADER ====== */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.level-info{font-size:13px;color:var(--sub)}
.level-bar{height:4px;background:rgba(0,0,0,.06);border-radius:2px;overflow:hidden;margin-bottom:14px}
.level-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:2px;transition:width .5s}

/* ====== DOG ====== */
.dog-area{text-align:center;position:relative;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dog-wrap{position:relative;display:inline-block;cursor:pointer;touch-action:none}
.dog{font-size:130px;transition:transform .2s;position:relative;z-index:2;pointer-events:none}
.dog:active{transform:scale(.9)}
.dog.bounce{animation:bounce .4s ease}
.dog.wag{animation:wag .3s ease}
.dog.happy{animation:happy .6s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-24px)}60%{transform:translateY(-8px)}}
@keyframes wag{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes happy{0%{transform:scale(1)}30%{transform:scale(1.12) rotate(-6deg)}60%{transform:scale(1.08) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.accessory{position:absolute;font-size:36px;pointer-events:none;z-index:3}
.accessory.hat{top:-28px;left:50%;transform:translateX(-50%)}
.accessory.bow{top:8px;right:-10px}
.accessory.glasses{top:20px;left:50%;transform:translateX(-50%)}
.mood-text{font-size:12px;color:var(--sub);margin-top:8px;height:18px}

/* ====== BUBBLE ====== */
.bubble{background:var(--card);border-radius:18px;padding:12px 18px;font-size:14px;color:var(--text);
  box-shadow:0 2px 12px rgba(0,0,0,.06);margin:10px 0;display:none;animation:popIn .4s ease;
  line-height:1.6;text-align:center;position:relative}
.bubble.show{display:block}
@keyframes popIn{0%{opacity:0;transform:scale(.8) translateY(8px)}100%{opacity:1;transform:scale(1) translateY(0)}}

/* ====== STATS & ACTIONS ====== */
.stats{display:flex;justify-content:center;gap:18px;margin:8px 0;font-size:12px;color:var(--sub)}
.stat{display:flex;align-items:center;gap:4px}.stat-v{font-weight:700;color:var(--pink)}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.btn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid rgba(0,0,0,.06);
  font-size:20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;
  position:relative;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.btn:active{transform:scale(.85)}.btn .badge{position:absolute;top:-4px;right:-4px;background:var(--pink);color:#fff;
  font-size:9px;border-radius:8px;padding:1px 5px;min-width:16px;text-align:center}

/* ====== BIG BUTTONS ====== */
.big-btn{display:block;width:100%;padding:14px;border-radius:16px;color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;margin:6px 0}
.big-btn:active{opacity:.8}
.checkin-btn{background:linear-gradient(135deg,var(--pink),var(--gold))}
.checkin-btn.done{background:#ddd;color:#999;cursor:default}
.gacha-btn{background:linear-gradient(135deg,var(--purple),#e040fb)}

/* ====== PAGE SYSTEM ====== */
.page{display:none}.page.active{display:block}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.g-item{background:var(--card);border-radius:12px;padding:10px;text-align:center;font-size:22px;
  cursor:pointer;border:2px solid transparent;transition:all .15s}
.g-item.owned{border-color:var(--pink)}
.g-item:active{transform:scale(.9)}
.g-item .price{font-size:10px;color:var(--sub);margin-top:2px}

/* ====== EFFECTS ====== */
.hearts{position:fixed;pointer-events:none;z-index:20}
.heart{position:absolute;font-size:24px;animation:floatUp 1.5s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-150px) scale(.3) rotate(20deg)}}
.confetti{position:fixed;font-size:20px;pointer-events:none;z-index:30;animation:cFall 2s ease-out forwards}
@keyframes cFall{0%{opacity:1;transform:translate(0,-20px) rotate(0)}100%{opacity:0;transform:translate(var(--cx),100vh) rotate(var(--cr))}}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);
  color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;
  display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:var(--card);border-radius:20px;padding:24px;text-align:center;max-width:300px;width:90%}
.modal-box h2{font-size:30px;margin-bottom:8px}.modal-box p{color:var(--sub);font-size:14px;margin-bottom:14px;line-height:1.6}
.modal-box button{padding:10px 28px;background:var(--pink);color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer}

/* ====== FALLING BONES (game) ====== */
.falling-bone{position:fixed;pointer-events:auto;z-index:999;cursor:pointer;animation:boneFall linear forwards}
@keyframes boneFall{0%{transform:translateY(-30px)}100%{transform:translateY(105vh)}}

/* ====== POLAROID ====== */
.polaroid-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);
  z-index:150;display:none;align-items:center;justify-content:center}
.polaroid-overlay.active{display:flex}
.polaroid-card{background:#fffdf7;padding:20px 20px 50px;border-radius:4px;
  box-shadow:0 8px 30px rgba(0,0,0,.2);text-align:center;max-width:280px;width:85%;
  animation:polaroidIn .5s ease}
@keyframes polaroidIn{0%{opacity:0;transform:scale(.5) rotate(-10deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
.polaroid-dog{font-size:100px;margin-bottom:8px;position:relative;display:inline-block}
.polaroid-dog .p-acc{position:absolute;font-size:28px}
.polaroid-dog .p-acc.hat{top:-22px;left:50%;transform:translateX(-50%)}
.polaroid-dog .p-acc.bow{top:6px;right:-8px}
.polaroid-dog .p-acc.glasses{top:16px;left:50%;transform:translateX(-50%)}
.polaroid-msg{font-size:15px;color:#555;margin:8px 0;line-height:1.5;font-family:'Georgia',serif;font-style:italic}
.polaroid-date{font-size:11px;color:#bbb;margin-top:6px}
.polaroid-actions{display:flex;gap:12px;justify-content:center;margin-top:16px}
.polaroid-btn{padding:10px 20px;border-radius:20px;border:none;font-size:14px;cursor:pointer;color:#fff}
.polaroid-btn.save{background:var(--pink)}.polaroid-btn.close{background:#999}
.polaroid-stamp{position:absolute;bottom:12px;right:16px;font-size:14px;color:#e91e63;font-weight:700;
  transform:rotate(-15deg);opacity:.7;font-family:'Georgia',serif}

/* ====== RAIN / WEATHER ====== */
.rain-drop{position:fixed;font-size:14px;pointer-events:none;z-index:1;animation:rDrop linear forwards}
@keyframes rDrop{0%{transform:translateY(-20px);opacity:.6}100%{transform:translateY(105vh);opacity:0}}
.snow-flake{position:fixed;font-size:16px;pointer-events:none;z-index:1;animation:sFall linear forwards}
@keyframes sFall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(105vh) rotate(360deg)}}
.sun-beam{position:fixed;font-size:20px;pointer-events:none;z-index:1;animation:sBeam linear forwards}
@keyframes sBeam{0%{opacity:0;transform:translateY(-20px)}30%{opacity:.5}100%{opacity:0;transform:translateY(105vh)}}
</style>
</head>
<body id="body">
<div class="hug-overlay" id="hugOverlay" onclick="Modules.Hug.end()">
  <div class="hug-dog" id="hugDogEl">🐕</div>
  <div class="hug-text" id="hugTextEl"></div>
  <div class="hug-sub">轻触退出</div>
</div>
<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="level-info" id="levelInfo">Lv1 陌生柴犬</div>
    <div style="display:flex;gap:8px">
      <button class="btn" style="width:36px;height:36px;font-size:16px" onclick="UI.showPage('home')">🏠</button>
      <button class="btn" style="width:36px;height:36px;font-size:16px" onclick="UI.showPage('wardrobe')">👗</button>
      <button class="btn" style="width:36px;height:36px;font-size:16px" onclick="UI.showPage('collection')">📔</button>
    </div>
  </div>
  <div class="level-bar"><div class="level-fill" id="levelBar" style="width:0%"></div></div>

  <!-- HOME PAGE -->
  <div class="page active" id="pageHome">
    <div class="dog-area">
      <div class="dog-wrap" onpointerdown="Input.down(event)" onpointerup="Input.up(event)" onpointerleave="Input.up(event)">
        <div class="accessory hat" id="accHat" style="display:none"></div>
        <div class="accessory glasses" id="accGlasses" style="display:none"></div>
        <div class="accessory bow" id="accBow" style="display:none"></div>
        <div class="dog" id="dogEl">🐕</div>
      </div>
      <div class="mood-text" id="moodText"></div>
    </div>
    <div class="bubble" id="bubbleEl"></div>
    <div class="stats">
      <div class="stat">❤️ <span class="stat-v" id="sAffection">0</span></div>
      <div class="stat">🦴 <span class="stat-v" id="sTreats">3</span></div>
      <div class="stat">📅 <span class="stat-v" id="sDays">1</span>天</div>
      <div class="stat">🔥 <span class="stat-v" id="sStreak">1</span></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="Modules.Feed.run(event)" title="喂食"><span class="badge" id="treatBadge">3</span>🍖</button>
      <button class="btn" onclick="Modules.Game.toggle()" id="gameBtn" title="游戏">🎮</button>
      <button class="btn" onclick="Modules.Love.run()" title="情书">💌</button>
      <button class="btn" onclick="Modules.Polaroid.open()" title="拍立得">📸</button>
      <button class="btn" onclick="Modules.Theme.cycle()" title="主题">🎨</button>
      <button class="btn" onclick="Modules.Audio.toggle()" id="musicBtn">🔊</button>
    </div>
    <button class="big-btn checkin-btn" id="checkinBtn" onclick="Modules.Checkin.run()">🎁 每日签到</button>
    <button class="big-btn gacha-btn" onclick="Modules.Gacha.run()">🎰 抽卡 (5🦴)</button>
  </div>

  <!-- WARDROBE PAGE -->
  <div class="page" id="pageWardrobe">
    <div style="font-weight:600;margin-bottom:10px">👗 衣柜</div>
    <div class="grid4" id="wardrobeGrid"></div>
    <button class="big-btn" style="background:var(--card);color:var(--text)" onclick="UI.showPage('home')">← 返回</button>
  </div>

  <!-- COLLECTION PAGE -->
  <div class="page" id="pageCollection">
    <div style="font-weight:600;margin-bottom:10px">📔 收藏册</div>
    <div class="grid4" id="collectionGrid"></div>
    <button class="big-btn" style="background:var(--card);color:var(--text)" onclick="UI.showPage('home')">← 返回</button>
  </div>
</div>

<!-- EFFECTS -->
<div class="hearts" id="heartsEl"></div>
<div class="toast" id="toastEl"></div>
<div class="modal" id="modalEl" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal-box"><h2 id="modalIcon"></h2><p id="modalMsg"></p><button onclick="document.getElementById('modalEl').classList.remove('show')">知道啦 ✨</button></div>
</div>

<!-- POLAROID OVERLAY -->
<div class="polaroid-overlay" id="polaroidOverlay" onclick="if(event.target===this) Modules.Polaroid.close()">
  <div class="polaroid-card" style="position:relative">
    <div class="polaroid-dog">
      <span id="pDog">🐕</span>
      <span class="p-acc hat" id="pAccHat" style="display:none"></span>
      <span class="p-acc bow" id="pAccBow" style="display:none"></span>
      <span class="p-acc glasses" id="pAccGlasses" style="display:none"></span>
    </div>
    <div class="polaroid-msg" id="pMsg"></div>
    <div class="polaroid-date" id="pDate"></div>
    <div class="polaroid-stamp" id="pStamp">🐕</div>
    <div class="polaroid-actions">
      <button class="polaroid-btn close" onclick="Modules.Polaroid.close()">✕ 关闭</button>
      <button class="polaroid-btn save" onclick="Modules.Polaroid.share()">💾 保存</button>
    </div>
  </div>
</div>

<script>
// ================================================================
//  ARCHITECTURE: State → UI → Input → Modules → Effects → Audio
// ================================================================

// ===================== STATE MANAGER =====================
const Store = {
  KEY: 'shiba_v5',
  defaults: {treats:3, affection:0, level:1, pets:0, days:1, streak:1,
    lastCheckin:'', wardrobe:{}, equipped:{}, collection:{}, highScore:0,
    firstOpen:new Date().toISOString(), music:true, theme:'day'},
  data: null,

  init(){ this.data = JSON.parse(localStorage.getItem(this.KEY) || JSON.stringify(this.defaults))
    if(!this.data.firstOpen) this.data.firstOpen = new Date().toISOString()
    if(!this.data.wardrobe) this.data.wardrobe = {}
    if(!this.data.equipped) this.data.equipped = {}
    if(!this.data.collection) this.data.collection = {}
    this.save()
  },
  save(){ localStorage.setItem(this.KEY, JSON.stringify(this.data)) },
  get(k){ return this.data[k] },
  set(k,v){ this.data[k]=v; this.save() },
  add(k,n){ this.data[k]=(this.data[k]||0)+n; this.save() },
}

// ===================== AUDIO ENGINE =====================
const Audio = {
  ctx: null,
  init(){
    document.addEventListener('click',()=>{
      if(!this.ctx) this.ctx = new(window.AudioContext||window.webkitAudioContext)()
      if(this.ctx.state==='suspended') this.ctx.resume()
    },{once:true})
  },
  _safe(fn){
    if(!Store.get('music')) return
    try{ if(!this.ctx||this.ctx.state==='suspended') this.ctx?.resume(); fn(this.ctx) }catch(e){}
  },
  bark(){ this._safe(c=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination)
    o.type='sawtooth';o.frequency.setValueAtTime(500,c.currentTime);o.frequency.exponentialRampToValueAtTime(150,c.currentTime+.2)
    g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.25)
    o.start();o.stop(c.currentTime+.25)}) },
  happy(){ this._safe(c=>{[523,659,784].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination)
    o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.1,c.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.3+i*.12)
    o.start(c.currentTime+i*.12);o.stop(c.currentTime+.3+i*.12)})}) },
  purr(){ this._safe(c=>{for(let i=0;i<3;i++){setTimeout(()=>{const o=c.createOscillator(),g=c.createGain()
    o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=60+Math.random()*20
    g.gain.setValueAtTime(.04,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.5)
    o.start();o.stop(c.currentTime+1.5)},i*500)}}) },
  toggle(){ Store.set('music',!Store.get('music')); UI.update() },
}

// ===================== EFFECTS SYSTEM =====================
const FX = {
  hearts(n){
    const hc=document.getElementById('heartsEl'),e=['💕','💖','✨','🌸','💝','🎀','💗']
    for(let i=0;i<n;i++) setTimeout(()=>{
      const h=document.createElement('span');h.className='heart';h.textContent=e[Math.floor(Math.random()*e.length)]
      h.style.left=Math.random()*80+10+'%';h.style.top='85%';h.style.animationDuration=(1+Math.random()*1.5)+'s'
      hc.appendChild(h);setTimeout(()=>h.remove(),1800)
    },i*50)
  },
  confetti(){
    const e=['🎉','🎊','✨','🌟','💫','🎀','🌸','💖']
    for(let i=0;i<25;i++) setTimeout(()=>{
      const c=document.createElement('span');c.className='confetti'
      c.textContent=e[Math.floor(Math.random()*e.length)]
      c.style.left=Math.random()*100+'%';c.style.top='-20px'
      c.style.setProperty('--cx',(Math.random()*200-100)+'px');c.style.setProperty('--cr',(Math.random()*720-360)+'deg')
      document.body.appendChild(c);setTimeout(()=>c.remove(),2200)
    },i*25)
  },
  bubble(msg){ const b=document.getElementById('bubbleEl');b.classList.remove('show');void b.offsetWidth;b.innerHTML=msg;b.classList.add('show') },
  toast(msg){ const t=document.getElementById('toastEl');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000) },
  modal(icon,msg){ document.getElementById('modalIcon').textContent=icon;document.getElementById('modalMsg').innerHTML=msg.replace(/\n/g,'<br>');document.getElementById('modalEl').classList.add('show') },
}

// ===================== UI RENDERER =====================
const UI = {
  showPage(p){
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'))
    document.getElementById('page'+p[0].toUpperCase()+p.slice(1)).classList.add('active')
    if(p==='wardrobe') UI.renderWardrobe()
    if(p==='collection') UI.renderCollection()
  },
  update(){
    const S=Store.data, lvl=Cat.dog.level(), pct=Cat.dog.levelPct()
    document.getElementById('levelInfo').textContent = Cat.dog.levels[lvl]
    document.getElementById('levelBar').style.width = pct+'%'
    document.getElementById('sAffection').textContent = S.affection
    document.getElementById('sTreats').textContent = S.treats
    document.getElementById('sDays').textContent = S.days
    document.getElementById('sStreak').textContent = S.streak
    document.getElementById('treatBadge').textContent = S.treats
    document.getElementById('moodText').textContent = Cat.dog.moodText()
    document.getElementById('musicBtn').textContent = Store.get('music')?'🔊':'🔇'
    const today = new Date().toDateString()
    const cb = document.getElementById('checkinBtn')
    if(S.lastCheckin===today){ cb.textContent='✅ 今日已签到'; cb.classList.add('done') }
    else{ cb.textContent='🎁 每日签到'; cb.classList.remove('done') }
    UI.updateAccessories()
  },
  updateAccessories(){
    const items = Cat.wardrobe.items, eq = Store.get('equipped')
    document.getElementById('accHat').style.display = eq.hat?'block':'none'
    document.getElementById('accHat').textContent = items.find(i=>i.id===eq.hat)?.emoji||''
    document.getElementById('accGlasses').style.display = eq.glasses?'block':'none'
    document.getElementById('accGlasses').textContent = '🕶'
    document.getElementById('accBow').style.display = eq.bow?'block':'none'
    document.getElementById('accBow').textContent = '🎀'
  },
  renderWardrobe(){
    const items = Cat.wardrobe.items, owned = Store.get('wardrobe'), eq = Store.get('equipped')
    document.getElementById('wardrobeGrid').innerHTML = items.map(i=>{
      const o=owned[i.id], e=eq[i.slot]===i.id
      return '<div class="g-item'+(o?' owned':'')+(e?'" style="border-color:#f59e0b"':'')+'" onclick="Cat.wardrobe.toggle(\''+i.id+'\')">'+i.emoji+'<div class=price>'+(!o?i.price+'🦴':e?'✓':'穿')+'</div></div>'
    }).join('')
  },
  renderCollection(){
    document.getElementById('collectionGrid').innerHTML = Cat.collect.items.map(c=>
      '<div class="g-item"><span style="font-size:24px">'+c+'</span><div class=price>'+(Store.get('collection')[c]||0)+'个</div></div>'
    ).join('')
  },
}

// ===================== INPUT HANDLER =====================
const Input = {
  timer: null, start: 0, didHug: false,
  down(e){
    e.preventDefault(); this.didHug=false; this.start=Date.now()
    clearTimeout(this.timer)
    this.timer = setTimeout(()=>{ this.didHug=true; Modules.Hug.start() }, 2000)
  },
  up(e){
    e.preventDefault(); clearTimeout(this.timer)
    if(!this.didHug && Date.now()-this.start<1500) Modules.Dog.tap()
  },
}

// ===================== CATALOG =====================
const Cat = {
  dog: {
    emojis: ['🐕','🐶','🐩','🦮','🐕‍🦺'],
    moods: {happy:'😊 开心',miss:'🥺 想你',sleepy:'😴 困了',hungry:'🤤 馋了',proud:'😎 得意',love:'❤️ 超开心'},
    levels: ['Lv1 陌生柴犬','Lv2 认识你啦','Lv3 最喜欢你','Lv4 永远陪你'],

    level(){ const a=Store.get('affection'); for(let i=3;i>=0;i--) if(a>=this.levelReq[i]||i===0) return i },
    levelPct(){ const l=this.level(),cur=l>0?Store.get('affection')-this.levelReq[l-1]:Store.get('affection'),max=l>0?this.levelReq[l]-this.levelReq[l-1]:this.levelReq[0];return Math.min(100,Math.round(cur/max*100))},
    mood(){ const now=Date.now(),last=parseInt(localStorage.getItem('shiba_last_active')||'0'),mins=(now-last)/60000
      if(Store.get('treats')<=0&&mins<30)return'hungry';if(mins<5)return'happy';if(mins<60)return'miss';if(mins>180)return'sleepy';return'miss'},
    moodText(){ return this.moods[this.mood()]||'' },
    dialogues: {
      happy:['今天心情超好！','嘿嘿，好开心～','你来啦！','汪！今天也很喜欢你'],
      miss:['好久不见...','一直在等你。','终于来了！','好想你呀'],

    },
  },
  wardrobe: {
    items: [
      {id:'bow_red',emoji:'🎀',price:5,slot:'bow'},
      {id:'hat_small',emoji:'👒',price:5,slot:'hat'},
      {id:'cap',emoji:'🧢',price:8,slot:'hat'},
      {id:'glasses',emoji:'🕶',price:10,slot:'glasses'},
      {id:'bee',emoji:'🐝',price:15,slot:'hat'},
      {id:'santa',emoji:'🎄',price:20,slot:'hat'},
      {id:'crown',emoji:'👑',price:30,slot:'hat'},
    ],
    toggle(itemId){
      const item=this.items.find(i=>i.id===itemId); if(!item) return
      const owned=Store.get('wardrobe')
      if(!owned[itemId]){
        if(Store.get('treats')<item.price){ FX.toast('🦴不够！需要'+item.price+'狗粮'); return }
        Store.add('treats',-item.price); owned[itemId]=true; Store.set('wardrobe',owned)
      }
      const eq=Store.get('equipped')
      eq[item.slot]=eq[item.slot]===itemId?null:itemId; Store.set('equipped',eq)
      UI.renderWardrobe(); UI.update()
    },
  },
  collect: {
    items: ['🍓','🌼','🍀','⭐','🍬','❤️','🌸','💎','🎀','🦋'],
    maybeDrop(){
      if(Math.random()<.15){ const c=this.items[Math.floor(Math.random()*this.items.length)]
        const col=Store.get('collection'); col[c]=(col[c]||0)+1; Store.set('collection',col); FX.toast('✨ 获得了 '+c) }
    },
  },
  gacha: {
    pool: [
      {r:'SSR',t:'🌟',m:'限定皇冠！永久拥有',a:'crown',p:5},
      {r:'SR',t:'💫',m:'超级狗粮包 +10',p:15},
      {r:'SR',t:'🎀',m:'稀有蝴蝶结',a:'bow_red',p:15},
      {r:'R',t:'🍖',m:'狗粮 +5',p:30},
      {r:'R',t:'🕶',m:'酷酷墨镜',a:'glasses',p:15},
      {r:'N',t:'🦴',m:'狗粮 +2',p:20},
    ],
  },
}

  Checkin: {
    run(){
      const today=new Date().toDateString()
      if(Store.get('lastCheckin')===today){ FX.toast('今天已经签到过啦！'); return }
      const yesterday=new Date(Date.now()-864e5).toDateString()
      const streak=Store.get('lastCheckin')===yesterday?Store.get('streak')+1:1
      Store.set('streak',streak);Store.set('lastCheckin',today);Store.add('days',1)
      let bonus=3;if(streak>=30)bonus=20;else if(streak>=15)bonus=12;else if(streak>=7)bonus=8;else if(streak>=3)bonus=5
      Store.add('treats',bonus);Store.add('affection',5)
      let extra=''
      if(streak===3){ const w=Store.get('wardrobe');w['bow_red']=true;Store.set('wardrobe',w);extra=' 🎀 获得蝴蝶结！' }
      if(streak===7){ const w=Store.get('wardrobe');w['hat_small']=true;Store.set('wardrobe',w);extra=' 👒 获得小帽子！' }

      if(streak===30){ const w=Store.get('wardrobe');w['glasses']=true;Store.set('wardrobe',w);extra=' 🕶 获得墨镜！' }

  Game: {
    active:false,timer:null,interval:null,score:0,combo:0,maxCombo:0,golden:false,cTimeout:null,
    toggle(){ this.active?this.stop():this.start() },
    start(){
      this.active=true;this.score=0;this.combo=0;this.maxCombo=0;this.golden=false
      document.getElementById('gameBtn').textContent='⏹';FX.toast('🎮 接骨头！')
      this.interval=setInterval(()=>this.spawn(),700);this.timer=setTimeout(()=>this.stop(),25000)
      setTimeout(()=>{this.golden=true;FX.toast('🌟 金骨头！')},10000)
    },
    spawn(){
      if(!this.active)return;const b=document.createElement('span')
      const isG=this.golden&&Math.random()<.2;b.textContent=isG?'🌟':'🍖'
      b.dataset.pts=isG?'3':'1'
      b.className='falling-bone';b.style.left=Math.random()*90+'%'
      b.style.fontSize=isG?'40px':'28px';b.style.animationDuration=(isG?1.5:2.5+Math.random()*2)+'s'
      b.onclick=e=>{e.stopPropagation();this.catch(b)}
      document.body.appendChild(b);setTimeout(()=>b.remove(),6000)
    },
    catch(boneEl){
      if(!this.active)return;const pts=parseInt(boneEl.dataset.pts||'1')
      this.combo++;if(this.combo>this.maxCombo)this.maxCombo=this.combo
      let bonus=this.combo>=10?3:this.combo>=5?2:this.combo>=3?1:0
      this.score+=pts+bonus;boneEl.remove();FX.hearts(pts+bonus>1?5:3);Audio.happy()
      if(this.combo===3)FX.toast('🔥 3连击！');if(this.combo===5)FX.toast('⚡ 5连击！');if(this.combo===10)FX.toast('💥 10连击！')
      clearTimeout(this.cTimeout);this.cTimeout=setTimeout(()=>{this.combo=0},1500)
    },
    stop(){
      this.active=false;clearTimeout(this.timer);clearInterval(this.interval);clearTimeout(this.cTimeout)
      document.getElementById('gameBtn').textContent='🎮'
      if(this.score>0){ const reward=Math.floor(this.score/5);Store.add('treats',Math.min(reward,99))
        if(this.score>Store.get('highScore'))Store.set('highScore',this.score)
        FX.modal('🎯','得分 '+this.score+' | 连击 '+this.maxCombo+'x\n+'+reward+' 🦴');UI.update() }
      this.combo=0;this.maxCombo=0
    },
  },

  Gacha: {
    run(){
      if(Store.get('treats')<5){ FX.toast('需要 5🦴'); return }
      Store.add('treats',-5)
      const r=Math.random()*100;let cum=0,prize=null
      for(const p of Cat.gacha.pool){ cum+=p.p; if(r<cum){ prize=p; break } }
      if(!prize) prize=Cat.gacha.pool[Cat.gacha.pool.length-1]
      let msg=prize.t+' '+prize.r+'!\n'+prize.m
      if(prize.a){ const w=Store.get('wardrobe');w[prize.a]=true;Store.set('wardrobe',w);msg+='\n已加入衣柜！' }
      FX.modal(prize.r==='SSR'?'🌟':'🎰',msg)
      if(prize.r==='SSR'){ FX.confetti();FX.hearts(20);Audio.happy() }
      UI.update()
    },
  },

  Theme: {

    weatherIdx: 0,
    cycle(){
      this.weatherIdx = (this.weatherIdx+1)%this.weathers.length
      const w = this.weathers[this.weatherIdx]
      document.getElementById('body').className = 'day' // reset bg
      // Stop any running weather effects
      document.querySelectorAll('.rain-drop,.snow-flake,.sun-beam').forEach(e=>e.remove())
      if(w==='☀️'){ document.body.style.background='linear-gradient(135deg,#fff9c4,#ffe0b2)'; this.sunEffect() }
      if(w==='🌧️'){ document.body.style.background='linear-gradient(135deg,#e3f2fd,#bbdefb)'; this.rainEffect() }
      if(w==='❄️'){ document.body.style.background='linear-gradient(135deg,#e8eaf6,#c5cae9)'; this.snowEffect() }
      if(w==='⛅'){ document.body.style.background='linear-gradient(135deg,#f5f5f5,#e0e0e0)' }
      FX.toast('天气切换：'+w)
    },
    rainEffect(){
      for(let i=0;i<40;i++) setTimeout(()=>{const d=document.createElement('span');d.className='rain-drop';d.textContent='💧';d.style.left=Math.random()*100+'%';d.style.animationDuration=(1+Math.random()*1.5)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2500)},i*60)
    },
    snowEffect(){
      const flakes=['❄️','🌨️','⛄','💠']
      for(let i=0;i<30;i++) setTimeout(()=>{const d=document.createElement('span');d.className='snow-flake';d.textContent=flakes[Math.floor(Math.random()*flakes.length)];d.style.left=Math.random()*100+'%';d.style.animationDuration=(3+Math.random()*4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),7000)},i*120)
    },
    sunEffect(){
      const beams=['☀️','✨','💫','🌟']
      for(let i=0;i<15;i++) setTimeout(()=>{const d=document.createElement('span');d.className='sun-beam';d.textContent=beams[Math.floor(Math.random()*beams.length)];d.style.left=Math.random()*100+'%';d.style.animationDuration=(2+Math.random()*3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5000)},i*200)
    },
    getDialogue(){
      const w=this.weathers[this.weatherIdx]
      if(w==='🌧️') return ['下雨了，柴犬帮你撑伞 🌂','雨天最适合在家陪你','外面的雨声很好听']
      if(w==='❄️') return ['下雪了！好冷，抱紧一点','柴犬的毛很暖和哦','冬天就是要贴在一起']
      if(w==='☀️') return ['太阳好大，戴个墨镜吧 😎','今天天气超好！','阳光和你都很灿烂']
      return null
    },
  },

    },
  },
}
