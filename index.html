<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>我的柴犬</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fce4ec;--card:#fff;--text:#333;--sub:#999;--pink:#e91e63;--gold:#f59e0b;--purple:#7c4dff;--dog-filter:none}
body.night{--bg:#1a1a2e;--card:#2a2a4a;--text:#e0e0f0;--sub:#888}
body.sunset{--bg:#ffe0b2;--card:#fff8e1;--text:#5d4037;--sub:#a1887f}
body.rain{--bg:#e3f2fd;--card:#fff;--text:#37474f;--sub:#90a4ae}
body.day{--bg:#fce4ec;--card:#fff;--text:#333;--sub:#999}
body.snow{--bg:#e8eaf6;--card:#fff;--text:#37474f;--sub:#90a4ae}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;transition:background .8s;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-tap-highlight-color:transparent}
.app{max-width:420px;width:100%;padding:16px}
.hug-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .4s}
.hug-overlay.active{display:flex;opacity:1}
.hug-dog{font-size:160px;animation:hugBreathe 2s ease-in-out infinite}
.hug-text{color:#fff;font-size:20px;margin:20px 0;opacity:.9;text-align:center;max-width:280px;line-height:1.5}
.hug-sub{color:rgba(255,255,255,.4);font-size:13px;cursor:pointer}
@keyframes hugBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.level-info{font-size:13px;color:var(--sub)}.level-bar{height:4px;background:rgba(0,0,0,.06);border-radius:2px;overflow:hidden;margin-bottom:14px}
.level-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:2px;transition:width .5s}

/* DOG CANVAS */
.dog-canvas{position:relative;width:200px;height:200px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.dog-base{font-size:130px;position:relative;z-index:1;transition:transform .2s}
.dog-base.bounce{animation:bounce .4s ease}.dog-base.wag{animation:wag .3s ease}.dog-base.happy{animation:happy .6s ease}
.dog-photo{object-fit:cover;display:block;border-radius:50%;background:#f3f3f3;filter:var(--dog-filter,none);box-shadow:0 4px 16px rgba(0,0,0,.12)}
.dog-base .dog-photo{width:150px;height:150px}
.hug-dog .dog-photo{width:180px;height:180px}
.polaroid-dog .dog-photo{width:120px;height:120px}
.onboard-emoji .dog-photo{width:90px;height:90px}
#dog3d{width:170px;height:170px;display:block;border:none;background:transparent;touch-action:none}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-24px)}60%{transform:translateY(-8px)}}
@keyframes wag{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes happy{0%{transform:scale(1)}30%{transform:scale(1.12) rotate(-6deg)}60%{transform:scale(1.08) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
/* Accessory items rendered as absolute positioned spans */
.acc-item{position:absolute;pointer-events:none;transform:translate(-50%,-50%);transition:all .3s}
.acc-item.preview{opacity:.4;filter:grayscale(.5)}

.mood-text{font-size:12px;color:var(--sub);text-align:center;margin-top:4px;height:18px}
.bubble{background:var(--card);border-radius:18px;padding:12px 18px;font-size:14px;color:var(--text);box-shadow:0 2px 12px rgba(0,0,0,.06);margin:10px 0;display:none;animation:popIn .4s ease;line-height:1.6;text-align:center}
.bubble.show{display:block}
@keyframes popIn{0%{opacity:0;transform:scale(.8) translateY(8px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.stats{display:flex;justify-content:center;gap:18px;margin:8px 0;font-size:12px;color:var(--sub)}
.stat{display:flex;align-items:center;gap:4px}.stat-v{font-weight:700;color:var(--pink)}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.btn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid rgba(0,0,0,.06);font-size:20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.btn:active{transform:scale(.85)}.btn .badge{position:absolute;top:-4px;right:-4px;background:var(--pink);color:#fff;font-size:9px;border-radius:8px;padding:1px 5px;min-width:16px;text-align:center}
.big-btn{display:block;width:100%;padding:14px;border-radius:16px;color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;margin:6px 0}.big-btn:active{opacity:.8}
.checkin-btn{background:linear-gradient(135deg,var(--pink),var(--gold))}.checkin-btn.done{background:#ddd;color:#999;cursor:default}
.gacha-btn{background:linear-gradient(135deg,var(--purple),#e040fb)}
.page{display:none}.page.active{display:block}
/* Wardrobe grid */
.wardrobe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.w-slot{border-radius:12px;padding:8px;text-align:center;background:var(--card);border:2px solid transparent;cursor:pointer;font-size:13px}
.w-slot:hover,.w-slot.active{border-color:var(--pink)}
.w-slot .emoji{font-size:28px;display:block;margin-bottom:2px}
.w-slot .label{font-size:10px;color:var(--sub)}
.w-slot .mount{font-size:9px;color:var(--sub);margin-top:2px}
.outfit-section{margin:10px 0}
.outfit-chip{display:inline-block;padding:6px 14px;border-radius:14px;background:var(--card);border:1px solid rgba(0,0,0,.08);font-size:12px;cursor:pointer;margin:3px;transition:all .15s}
.outfit-chip:active{background:var(--pink);color:#fff}

/* Effects */
.hearts{position:fixed;pointer-events:none;z-index:20}
.heart{position:absolute;font-size:24px;animation:floatUp 1.5s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-150px) scale(.3) rotate(20deg)}}
.confetti{position:fixed;font-size:20px;pointer-events:none;z-index:30;animation:cFall 2s ease-out forwards}
@keyframes cFall{0%{opacity:1;transform:translate(0,-20px) rotate(0)}100%{opacity:0;transform:translate(var(--cx),100vh) rotate(var(--cr))}}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:var(--card);border-radius:20px;padding:24px;text-align:center;max-width:300px;width:90%;animation:popIn .4s ease}
.modal-box h2{font-size:30px;margin-bottom:8px}.modal-box p{color:var(--sub);font-size:14px;margin-bottom:14px;line-height:1.6}
.modal-box button{padding:10px 28px;background:var(--pink);color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer}
.falling-bone{position:fixed;pointer-events:auto;z-index:999;cursor:pointer;animation:boneFall linear forwards}
@keyframes boneFall{0%{transform:translateY(-30px)}100%{transform:translateY(105vh)}}
.polaroid-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:150;display:none;align-items:center;justify-content:center}
.polaroid-overlay.active{display:flex}
.polaroid-card{background:#fffdf7;padding:20px 20px 50px;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.2);text-align:center;max-width:280px;width:85%;animation:polaroidIn .5s ease}
@keyframes polaroidIn{0%{opacity:0;transform:scale(.5) rotate(-10deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
.polaroid-dog{font-size:100px;margin-bottom:8px}
.polaroid-msg{font-size:15px;color:#555;margin:8px 0;line-height:1.5;font-family:Georgia,serif;font-style:italic}
.polaroid-date{font-size:11px;color:#bbb;margin-top:6px}
.polaroid-actions{display:flex;gap:12px;justify-content:center;margin-top:16px}
.polaroid-btn{padding:10px 20px;border-radius:20px;border:none;font-size:14px;cursor:pointer;color:#fff}
.polaroid-btn.save{background:var(--pink)}.polaroid-btn.close{background:#999}
.rain-drop{position:fixed;font-size:14px;pointer-events:none;z-index:1;animation:rDrop linear forwards}
@keyframes rDrop{0%{transform:translateY(-20px);opacity:.6}100%{transform:translateY(105vh);opacity:0}}
.snow-flake{position:fixed;font-size:16px;pointer-events:none;z-index:1;animation:sFall linear forwards}
@keyframes sFall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(105vh) rotate(360deg)}}
.sun-beam{position:fixed;font-size:20px;pointer-events:none;z-index:1;animation:sBeam linear forwards}
@keyframes sBeam{0%{opacity:0;transform:translateY(-20px)}30%{opacity:.5}100%{opacity:0;transform:translateY(105vh)}}
@keyframes floatScore{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}50%{opacity:1;transform:translate(-50%,-80%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
/* ====== ONBOARDING ====== */
.onboard-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center}
.onboard-overlay.active{display:flex}
.onboard-card{background:var(--card);border-radius:24px;padding:24px 20px;text-align:center;max-width:300px;width:85%;animation:popIn .4s ease}
.onboard-emoji{font-size:60px;margin-bottom:8px}
.onboard-title{font-size:18px;font-weight:700;margin-bottom:6px;color:var(--text)}
.onboard-desc{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.6;white-space:pre-line}
.onboard-dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.onboard-dot{width:8px;height:8px;border-radius:50%;background:#ddd;transition:all .3s}
.onboard-dot.cur{background:var(--pink);width:24px;border-radius:4px}
.onboard-btn{padding:12px 32px;border-radius:20px;background:var(--pink);color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer}
.onboard-skip{color:var(--sub);font-size:12px;margin-top:10px;cursor:pointer}
</style>
</head>
<body id="body">
<div class="hug-overlay" id="hugOverlay" onclick="M.Hug.end()"><div class="hug-dog" id="hugDogEl"><img class="dog-photo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Shiba_inu_taiki.jpg/500px-Shiba_inu_taiki.jpg" alt="柴犬"></div><div class="hug-text" id="hugTextEl"></div><div class="hug-sub">轻触退出</div></div>
<div class="app">
<div class="header"><div class="level-info" id="levelInfo">Lv1</div>
<div style="display:flex;gap:8px;align-items:center">
<span style="font-size:11px;color:var(--sub);cursor:pointer" onclick="M.Rename.show()" title="改名">✏️ <span id="dogNameDisplay">柴犬</span></span>
<button class="btn" style="width:28px;height:28px;font-size:14px" onclick="M.Dog.cycleSkin()" id="skinBtn" title="换造型">🎨</button>

<!-- HOME -->

<button class="btn" onclick="M.Audio.toggle()" id="musicBtn">🔊</button>
      <button class="btn" onclick="M.Share.run()" title="分享">🔗</button>
      <button class="btn" onclick="M.Feedback.show()" title="反馈">💬</button>
</div>
<button class="big-btn checkin-btn" id="checkinBtn" onclick="M.Checkin.run()">🎁 每日签到</button>
<button class="big-btn gacha-btn" onclick="M.Gacha.run()">🎰 抽卡 (5🦴)</button>
</div>

<!-- WARDROBE -->
<div class="page" id="pageWardrobe"><div style="font-weight:600;margin-bottom:6px">👗 全身装扮</div>
<div class="outfit-section" id="outfitPresets"></div>
<button class="big-btn" style="background:var(--card);color:var(--text);margin:4px 0;font-size:13px" onclick="M.Wardrobe.undressAll()">👙 一键卸下全部</button>
<div class="wardrobe-grid" id="wardrobeGrid"></div>
<button class="big-btn" style="background:var(--card);color:var(--text);margin-top:8px" onclick="UI.page('home')">← 返回</button></div>

<!-- COLLECTION -->
<div class="page" id="pageCollection"><div style="font-weight:600;margin-bottom:10px">📔 收藏册</div>
<div class="wardrobe-grid" id="collectionGrid"></div>
<button class="big-btn" style="background:var(--card);color:var(--text);margin-top:10px" onclick="UI.page('home')">← 返回</button></div>
</div>

<div class="hearts" id="heartsEl"></div><div class="toast" id="toastEl"></div>
<div class="modal" id="modalEl" onclick="if(event.target===this)this.classList.remove('show')"><div class="modal-box"><h2 id="modalIcon"></h2><p id="modalMsg"></p><button onclick="document.getElementById('modalEl').classList.remove('show')">知道啦 ✨</button></div></div>

<!-- FEEDBACK MODAL -->

<div style="display:flex;justify-content:center;gap:12px;margin-bottom:14px" id="emojiRating">

<span style="font-size:36px;cursor:pointer;transition:all .2s;opacity:.4" onclick="M.Feedback.rate(4,this)" onmouseover="this.style.opacity='1';this.style.transform='scale(1.2)'" onmouseout="if(!this.classList.contains('sel')){this.style.opacity='.4';this.style.transform='scale(1)'}">😊</span>
<span style="font-size:36px;cursor:pointer;transition:all .2s;opacity:.4" onclick="M.Feedback.rate(3,this)" onmouseover="this.style.opacity='1';this.style.transform='scale(1.2)'" onmouseout="if(!this.classList.contains('sel')){this.style.opacity='.4';this.style.transform='scale(1)'}">😐</span>
<span style="font-size:36px;cursor:pointer;transition:all .2s;opacity:.4" onclick="M.Feedback.rate(2,this)" onmouseover="this.style.opacity='1';this.style.transform='scale(1.2)'" onmouseout="if(!this.classList.contains('sel')){this.style.opacity='.4';this.style.transform='scale(1)'}">😕</span>
<span style="font-size:36px;cursor:pointer;transition:all .2s;opacity:.4" onclick="M.Feedback.rate(1,this)" onmouseover="this.style.opacity='1';this.style.transform='scale(1.2)'" onmouseout="if(!this.classList.contains('sel')){this.style.opacity='.4';this.style.transform='scale(1)'}">😢</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ==================== STORE ====================
const S={key:'shiba_v6',d:null,
  init(){this.d=JSON.parse(localStorage.getItem(this.key)||'{"treats":3,"affection":0,"level":0,"pets":0,"days":1,"streak":1,"lastCheckin":"","equipped":{},"collection":{},"highScore":0,"firstOpen":"'+new Date().toISOString()+'","music":true,"owned":{},"onboarded":false,"dogName":"柴犬","breedLock":false}');this.save()},
  save(){localStorage.setItem(this.key,JSON.stringify(this.d))},
  get(k){return this.d[k]},set(k,v){this.d[k]=v;this.save()},add(k,n){this.d[k]=(this.d[k]||0)+n;this.save()},
}

// ==================== MOUNT POINT SYSTEM ====================
const MountPoints={
  headTop:{top:5,left:50,baseW:60,baseH:30,label:'头顶'},
  leftEye:{top:28,left:35,baseW:20,baseH:12,label:'左眼'},
  rightEye:{top:28,left:65,baseW:20,baseH:12,label:'右眼'},
  neck:{top:42,left:50,baseW:40,baseH:16,label:'脖子'},
  bodyCenter:{top:62,left:50,baseW:70,baseH:50,label:'身体'},
  leftPaw:{top:78,left:28,baseW:16,baseH:16,label:'左爪'},
  rightPaw:{top:78,left:72,baseW:16,baseH:16,label:'右爪'},
  tail:{top:50,left:82,baseW:16,baseH:16,label:'尾巴'},
}

// ==================== BREED DATA ====================
const Breeds=[
  {emoji:'🐕',name:'柴犬',bodyShape:'normal'},
  {emoji:'🐶',name:'小狗',bodyShape:'round'},
  {emoji:'🐩',name:'贵宾',bodyShape:'slim'},
  {emoji:'🦮',name:'导盲犬',bodyShape:'normal'},
  {emoji:'🐕‍🦺',name:'服务犬',bodyShape:'normal'},
]
const DOG_PHOTO='https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Shiba_inu_taiki.jpg/500px-Shiba_inu_taiki.jpg'
function getBreed(){const e=document.getElementById('dogBase').textContent;return Breeds.find(b=>b.emoji===e)||Breeds[0]}

// ==================== ACCESSORY CATALOG ====================
// Each: {id, emoji, name, mount, wearPoint{pctX,pctY}, baseSize, layer, blocks[], price}
const Accessories=[
  // HEAD

// ==================== BREED ADJUSTMENTS ====================
function getContainerSize(){const c=document.getElementById('dogCanvas');return{cw:c.offsetWidth,ch:c.offsetHeight}}
function getMountPixelPos(mountKey){
  const mp=MountPoints[mountKey],{cw,ch}=getContainerSize()
  return{x:mp.left/100*cw,y:mp.top/100*ch}
}
function getBreedScaleFactor(mountKey){
  const breed=getBreed(),mp=MountPoints[mountKey]
  let s=1.0
  if(breed.bodyShape==='round')s*=1.05
  if(breed.bodyShape==='slim')s*=0.95
  return s
}

// ==================== RENDER ACCESSORIES ====================
const AccessoryRenderer={
  activeEls:[],
  clear(){
    this.activeEls.forEach(el=>el.remove());this.activeEls=[]
  },
  render(previewId=null){
    this.clear()
    const eq=S.get('equipped'),canvas=document.getElementById('dogCanvas'),{cw,ch}=getContainerSize()
    // Sort by layer
    const entries=[]
    for(const [k,v] of Object.entries(eq)) entries.push({id:v,key:k})
    // Get accessory definitions
    const toRender=entries.map(e=>{const acc=Accessories.find(a=>a.id===e.id);return acc?{...acc,eqKey:e.key}:null}).filter(Boolean)
    toRender.sort((a,b)=>a.layer-b.layer)
    
    toRender.forEach(acc=>{
      const mp=MountPoints[acc.mount],breedScale=getBreedScaleFactor(acc.mount)
      const px=mp.left/100*cw, py=mp.top/100*ch
      const scale=breedScale*(mp.baseW/acc.baseSize)*0.7
      const size=acc.baseSize*scale
      
      const el=document.createElement('span');el.className='acc-item'
      el.textContent=acc.emoji
      el.style.left=px+'px';el.style.top=py+'px'
      el.style.fontSize=size+'px'
      el.style.transform=`translate(-50%,-50%) translate(${(acc.wearPoint.pctX-50)/100*acc.baseSize}px,${(acc.wearPoint.pctY-50)/100*acc.baseSize}px)`
      el.style.zIndex=acc.layer
      if(previewId===acc.id)el.classList.add('preview')
      canvas.appendChild(el);this.activeEls.push(el)
    })
  },
}

  init(){
    const canvas=document.getElementById('dog3d');
    if(typeof THREE==='undefined'){this.fallback();return;}
    try{
      const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
      const w=canvas.clientWidth||170,h=canvas.clientHeight||170;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
      renderer.setSize(w,h,false);
      renderer.setClearColor(0x000000,0);
      const scene=new THREE.Scene();
      const camera=new THREE.PerspectiveCamera(35,w/h,0.1,100);
      scene.add(new THREE.AmbientLight(0xffffff,0.8));
      const key=new THREE.DirectionalLight(0xffffff,1.0);key.position.set(3,6,5);scene.add(key);
      const fill=new THREE.DirectionalLight(0xffe7cf,0.45);fill.position.set(-4,3,2);scene.add(fill);
      const rim=new THREE.DirectionalLight(0xbfe3ff,0.35);rim.position.set(-2,4,-4);scene.add(rim);

      dog.rotation.y=this.baseRot;
      scene.add(dog);

    applyOutfit(idx){
      const o=Outfits[idx],eq={},owned=S.get('owned')
      o.items.forEach(id=>{if(owned[id])eq[id]=id;else{FX.toast('需要先获得 '+Accessories.find(a=>a.id===id)?.name||id);return}})
      S.set('equipped',eq);UI.renderWardrobe();UI.update();FX.toast('✅ '+o.name+' 已穿戴')
    },
    undressAll(){S.set('equipped',{});UI.renderWardrobe();UI.update();FX.toast('👙 全部卸下啦～')},
  },
}

// IDLE ANIMATION
setInterval(()=>{if(!M.Game.active&&!document.getElementById('hugOverlay').classList.contains('active')){const db=document.getElementById('dogBase');if(Math.random()<.4){db.classList.add('wag');setTimeout(()=>db.classList.remove('wag'),300);if(Math.random()<.3)FX.bubble(Dialogues.idle[Math.floor(Math.random()*Dialogues.idle.length)])}}},10000)

// INIT
S.init();Audio.init();UI.update();Dog3D.init()
if(!S.get('onboarded'))setTimeout(()=>M.Onboard.start(),600)
// Welcome back
const last=parseInt(localStorage.getItem('shiba_last_active')||'0'),away=Math.floor((Date.now()-last)/3600000)
if(away>=2){const n=S.get('dogName')||'柴犬';setTimeout(()=>FX.bubble(n+'一直在等你 💕，你离开了 '+away+' 小时'),1500)}
localStorage.setItem('shiba_last_active',Date.now())
</script>
</body>
</html>
