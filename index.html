<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>戳一下 🐕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;align-items:center;min-height:100dvh;font-family:-apple-system,sans-serif;overflow:hidden;transition:background .5s}
body.day{background:linear-gradient(135deg,#fce4ec,#e8eaf6)}
body.night{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#e0e8f4}
body.sunset{background:linear-gradient(135deg,#ffe0b2,#ffccbc)}
body.play{background:linear-gradient(135deg,#e8f5e9,#c8e6c9)}
.card{text-align:center;max-width:420px;padding:16px;position:relative;z-index:5}
.dog-container{position:relative;display:inline-block;margin:8px 0;transition:all .3s}
.dog{font-size:120px;cursor:pointer;transition:transform .15s,font-size .3s;user-select:none;display:inline-block;position:relative;z-index:2}
.dog:active{transform:scale(.85)}
.dog.bounce{animation:bounce .4s ease}
.dog.shake{animation:shake .5s ease}
.dog.happy{animation:happy .6s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-28px)}60%{transform:translateY(-10px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes happy{0%{transform:scale(1)}30%{transform:scale(1.15) rotate(-8deg)}60%{transform:scale(1.1) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.paw{position:absolute;font-size:30px;pointer-events:none;animation:pawFade 3s ease-out forwards;z-index:1}
@keyframes pawFade{0%{opacity:.6;transform:scale(.5)}30%{opacity:.3;transform:scale(1)}100%{opacity:0;transform:scale(.8) translateY(20px)}}
.bubble{background:#fff;border-radius:22px;padding:14px 20px;font-size:14px;color:#333;box-shadow:0 4px 24px rgba(0,0,0,.1);margin-top:14px;display:none;animation:popIn .4s ease;line-height:1.6;position:relative}
body.night .bubble{background:#2a2a4a;color:#e0e0f0}
body.sunset .bubble{background:#fff8e1;color:#5d4037}
.bubble.show{display:block}
.bubble::after{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-bottom-color:#fff}
body.night .bubble::after{border-bottom-color:#2a2a4a}
body.sunset .bubble::after{border-bottom-color:#fff8e1}
@keyframes popIn{0%{opacity:0;transform:scale(.7) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.hint{color:#aaa;font-size:11px;margin-top:10px;transition:opacity .3s}
.stats{display:flex;justify-content:center;gap:18px;margin:8px 0;font-size:12px;color:#888}
.stat{display:flex;align-items:center;gap:3px}
.stat-val{color:#e91e63;font-weight:700}
.controls{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.btn{font-size:18px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.06);border-radius:50%;width:42px;height:42px;cursor:pointer;transition:all .15s;position:relative;display:flex;align-items:center;justify-content:center}
body.night .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.05)}
.btn:active{transform:scale(.82);background:rgba(255,255,255,.9)}
.btn .badge{position:absolute;top:-6px;right:-6px;background:#e91e63;color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;min-width:18px}
.treat{position:fixed;font-size:28px;pointer-events:none;z-index:50;animation:throwTreat 1.2s ease-in forwards}
@keyframes throwTreat{0%{opacity:1;transform:translate(0,0) rotate(0)}50%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(360deg)}100%{opacity:0;transform:translate(calc(var(--dx)*2),calc(var(--dy)*1.5+60px)) rotate(720deg)}}
.falling{position:fixed;font-size:30px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-10px) rotate(0)}100%{transform:translateY(105vh) rotate(720deg)}}
.hearts{position:fixed;pointer-events:none;z-index:10}
.heart{position:absolute;font-size:26px;animation:floatUp 1.5s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-160px) scale(.35) rotate(25deg)}}
.confetti{position:fixed;font-size:20px;pointer-events:none;z-index:30;animation:confettiFall 2s ease-out forwards}
@keyframes confettiFall{0%{opacity:1;transform:translate(0,-20px) rotate(0)}100%{opacity:0;transform:translate(var(--cx),100vh) rotate(var(--cr))}}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;display:none}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:30px;text-align:center;max-width:320px;width:90%}
.modal-box h2{font-size:28px;margin-bottom:8px}
.modal-box p{color:#666;font-size:14px;margin-bottom:16px}
.modal-box button{padding:10px 30px;background:#e91e63;color:#fff;border:none;border-radius:20px;font-size:15px;cursor:pointer}
.score-board{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);padding:8px 20px;border-radius:20px;font-size:14px;font-weight:700;z-index:40;display:none;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.score-board.show{display:block}
.cursor-dog{position:fixed;font-size:40px;pointer-events:none;z-index:100;transition:transform .1s;display:none}
</style>
</head>
<body class="day" id="body">
<div class="score-board" id="scoreBoard">🎯 <span id="scoreVal">0</span> | 接🍖小游戏</div>
<div class="card">
  <div class="dog-container" id="dogContainer">
    <div class="dog" onclick="petDog(event)" id="dog">🐕</div>
  </div>
  <div class="bubble" id="bubble"></div>
  <div class="hint">👆 戳柴犬 | 🍖 喂食 | 🎮 接骨头</div>
  <div class="stats">
    <div class="stat">❤️ <span class="stat-val" id="happiness">100</span></div>
    <div class="stat">🦴 <span class="stat-val" id="treats">3</span></div>
    <div class="stat">🐾 <span class="stat-val" id="pets">0</span></div>
  </div>
  <div class="controls">
    <button class="btn" onclick="switchTheme('day')">☀️</button>
    <button class="btn" onclick="switchTheme('sunset')">🌅</button>
    <button class="btn" onclick="switchTheme('night')">🌙</button>
    <button class="btn" onclick="throwTreat(event)"><span class="badge" id="treatBadge">3</span>🍖</button>
    <button class="btn" onclick="startGame()" id="gameBtn">🎮</button>
    <button class="btn" onclick="shareCard()">💌</button>
    <button class="btn" onclick="toggleMusic()" id="musicBtn">🔊</button>
  </div>
</div>
<div class="hearts" id="hearts"></div>
<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalIcon">🎉</h2>
    <p id="modalMsg"></p>
    <button onclick="document.getElementById('modal').classList.remove('show')">知道啦 ✨</button>
  </div>
</div>
<div class="cursor-dog" id="cursorDog">🐕</div>

<script>
const dogs=['🐕','🐶','🐩','🦮','🐕‍🦺','🐾']
let state={happiness:100,treats:3,pets:0,dogIdx:0,music:true,size:1,gameActive:false,score:0}
let audioCtx=null

document.addEventListener('click',()=>{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()
  if(audioCtx.state==='suspended')audioCtx.resume()
},{once:true})

const msgs=["今天辛苦了喝杯水休息一下 ☕","你已经很棒了别给自己太大压力 ✨","工作只是生活的一部分你才是主角 🌸","起来伸个懒腰 🐱","偷偷告诉你今天会有好事发生 🌈","没有什么是一顿好吃的解决不了的 🍜","你的努力时间看得见 💪","今天的你也是满分选手 🥇","摸鱼三分钟效率翻一倍 🐟","打工人打工魂打完工再去浪 🌊","全世界都在催你长大我在催你早睡 🌙","你是人间四月天 ☀️","可爱的人连加班都是可爱的 🎀","下班后的快乐在等你了 🍻","好运正在派送中请保持心情通畅 📦","追光的人自己也会身披光芒 ✨","白天有说有笑晚上睡个好觉 💤","今天不想上班明天也不想想 🤪"]
const treats=['🍖','🍗','🍩','🧀','🍎','🥩','🍰','🧁']
const ach={10:{icon:'🌟',msg:'柴犬之友！送你一朵小花'},25:{icon:'🏆',msg:'狗狗达人！柴犬想跟你回家了'},50:{icon:'👑',msg:'传说级铲屎官！'}}

function playBark(){
  if(!state.music)return
  try{
    if(!audioCtx)return
    if(audioCtx.state==='suspended')audioCtx.resume()
    const o=audioCtx.createOscillator(),g=audioCtx.createGain()
    o.connect(g);g.connect(audioCtx.destination)
    o.type='sawtooth';o.frequency.setValueAtTime(500,audioCtx.currentTime)
    o.frequency.exponentialRampToValueAtTime(150,audioCtx.currentTime+.2)
    g.gain.setValueAtTime(.2,audioCtx.currentTime)
    g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.25)
    o.start();o.stop(audioCtx.currentTime+.25)
  }catch(e){}
}

function playHappy(){
  if(!state.music)return
  try{
    if(!audioCtx||audioCtx.state==='suspended')audioCtx.resume()
    [523,659,784].forEach((f,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain()
      o.connect(g);g.connect(audioCtx.destination)
      o.type='triangle';o.frequency.value=f
      g.gain.setValueAtTime(.12,audioCtx.currentTime+i*.15)
      g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.4+i*.15)
      o.start(audioCtx.currentTime+i*.15);o.stop(audioCtx.currentTime+.4+i*.15)
    })
  }catch(e){}
}

function petDog(e){
  if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
  if(audioCtx.state==='suspended')audioCtx.resume()
  if(state.gameActive)return // 游戏模式，不触发狗
  
  const dog=document.getElementById('dog')
  const anims=['bounce','shake','happy']
  dog.classList.add(anims[Math.floor(Math.random()*anims.length)])
  setTimeout(()=>anims.forEach(a=>dog.classList.remove(a)),600)
  
  state.pets++
  if(state.pets%5===0){state.treats=Math.min(state.treats+1,10);spawnHearts(5)}
  updateStats()
  
  const b=document.getElementById('bubble')
  b.classList.remove('show');void b.offsetWidth
  b.textContent=msgs[Math.floor(Math.random()*msgs.length)]
  b.classList.add('show')
  
  spawnHearts(3+Math.floor(Math.random()*4))
  playBark()
  
  if(e){const rect=dog.getBoundingClientRect();spawnPaw(rect.left+rect.width/2+Math.random()*80-40,rect.top+Math.random()*40-20)}
  if(ach[state.pets]){
    showModal(ach[state.pets].icon,ach[state.pets].msg)
    playHappy();spawnHearts(15);spawnConfetti()
  }
  if(state.pets%12===0){state.dogIdx=(state.dogIdx+1)%dogs.length;dog.textContent=dogs[state.dogIdx]}
  state.size=1+Math.min(state.pets*.005,.5)
  dog.style.fontSize=(120*state.size)+'px'
}

function throwTreat(e){
  if(state.treats<=0){toast('🍖 狗粮不够！多戳柴犬赚狗粮');return}
  state.treats--;state.happiness=Math.min(state.happiness+10,200);updateStats()
  if(e){
    const t=document.createElement('span');t.className='treat'
    t.textContent=treats[Math.floor(Math.random()*treats.length)]
    t.style.left=e.clientX+'px';t.style.top=e.clientY+'px'
    t.style.setProperty('--dx',(Math.random()*200-100)+'px')
    t.style.setProperty('--dy',(Math.random()*-120-40)+'px')
    document.body.appendChild(t);setTimeout(()=>t.remove(),1300)
  }
  const dog=document.getElementById('dog');dog.classList.add('happy')
  setTimeout(()=>dog.classList.remove('happy'),600)
  spawnHearts(6);playHappy()
}

// 🎮 接骨头小游戏
let gameTimer=null,gameInterval=null,combo=0,maxCombo=0,goldenActive=false

function startGame(){
  if(state.gameActive){stopGame();return}
  state.gameActive=true;state.score=0;combo=0;maxCombo=0;goldenActive=false
  document.getElementById('body').classList.add('play')
  document.getElementById('scoreBoard').classList.add('show')
  document.getElementById('gameBtn').textContent='⏹'
  document.getElementById('dog').textContent='🐶'
  toast('🎮 接骨头！连击有加成 ⚡')
  
  gameInterval=setInterval(spawnBone,600)
  gameTimer=setTimeout(stopGame,25000)
  
  // 10秒后出金骨头
  setTimeout(()=>{goldenActive=true;toast('🌟 金骨头出现了！+3分')},10000)
  updateScore()
}

function spawnBone(){
  if(!state.gameActive)return
  const b=document.createElement('span')
  b.className='falling'
  
  // 金骨头概率
  const isGolden=goldenActive && Math.random()<.2
  b.textContent=isGolden?'🌟':'🍖'
  b.dataset.points=isGolden?'3':'1'
  b.style.left=Math.random()*90+'%'
  b.style.animationDuration=(isGolden?1.5:2.5+Math.random()*2)+'s'
  b.style.zIndex='999'
  b.style.pointerEvents='auto'
  b.style.fontSize=isGolden?'40px':'30px'
  b.onclick=function(e){e.stopPropagation();catchBone(e,b)}
  document.body.appendChild(b)
  setTimeout(()=>b.remove(),6000)
}

function catchBone(e,boneEl){
  if(!state.gameActive)return
  const pts=parseInt(boneEl.dataset.points||'1')
  combo++;if(combo>maxCombo)maxCombo=combo
  
  // 连击加分
  let bonus=0
  if(combo>=10)bonus=3
  else if(combo>=5)bonus=2
  else if(combo>=3)bonus=1
  
  state.score+=pts+bonus
  updateScore()
  boneEl.remove()
  
  // 特效
  const n=pts+bonus>1?6:3
  spawnHearts(n)
  playDing()
  
  // 连击提示
  if(combo===3)toast('🔥 3连击！')
  if(combo===5)toast('⚡ 5连击！+2分')
  if(combo===10)toast('💥 10连击！！+3分')
  
  // 金骨头特效
  if(pts>1){
    spawnConfetti()
    playHappy()
  }
  
  // 连击超时重置
  clearTimeout(window._comboTimer)
  window._comboTimer=setTimeout(()=>{combo=0},1500)
}

function playDing(){
  if(!state.music)return
  try{
    if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
    if(audioCtx.state==='suspended')audioCtx.resume()
    const o=audioCtx.createOscillator(),g=audioCtx.createGain()
    o.connect(g);g.connect(audioCtx.destination)
    o.type='sine'
    o.frequency.setValueAtTime(1200,audioCtx.currentTime)
    o.frequency.setValueAtTime(1800,audioCtx.currentTime+.06)
    g.gain.setValueAtTime(.2,audioCtx.currentTime)
    g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.12)
    o.start();o.stop(audioCtx.currentTime+.12)
  }catch(e){}
}

function stopGame(){
  state.gameActive=false;goldenActive=false
  clearTimeout(gameTimer);clearInterval(gameInterval);clearTimeout(window._comboTimer)
  document.getElementById('body').classList.remove('play')
  document.getElementById('scoreBoard').classList.remove('show')
  document.getElementById('gameBtn').textContent='🎮'
  document.getElementById('dog').textContent=dogs[state.dogIdx]
  
  if(state.score>0){
    // 奖励：每5分换1个狗粮
    const reward=Math.floor(state.score/5)
    state.treats=Math.min(state.treats+reward,99)
    updateStats()
    
    let title='🎯',msg=`得分 ${state.score} | 最高连击 ${maxCombo}x\n`
    if(state.score>=30){title='👑';msg+='🏆 完美！+'+reward+'狗粮'}
    else if(state.score>=15){title='🌟';msg+='👍 不错！+'+reward+'狗粮'}
    else if(state.score>=5){title='🎯';msg+='+'+reward+'狗粮'}
    else{title='🐶';msg+='再接再厉~'}
    
    showModal(title,msg)
    spawnConfetti()
    playHappy()
  }
  combo=0;maxCombo=0
  updateScore()
}

function updateScore(){
  const el=document.getElementById('scoreVal')
  el.textContent=state.score+(combo>1?` 🔥${combo}x`:'')
}

// 💌 分享卡片
function shareCard(){
  const hour=new Date().getHours()
  const d=dogs[state.dogIdx]
  
  const morning=["早上好呀，今天也要元气满满 ☀️","今天的阳光和你一样温柔 🌤️","早～柴犬说它梦到你了 💭"]
  const noon=["午饭吃了没？别饿着自己 🍱","中午休息一下，下午才有力气摸鱼 ☕","柴犬提醒：该恰饭了！🍜"]
  const afternoon=["打工累了吧？柴犬给你加油 💪","还有一会儿就下班了，坚持住 ⏰","偷偷告诉你，今天的你很棒 ✨"]
  const evening=["下班！今天的烦恼到此为止 🍻","辛苦了，晚上好好犒劳自己 🌙","柴犬牌晚安已送达，请签收 💤"]
  
  let msgs=afternoon
  if(hour<10)msgs=morning
  else if(hour<13)msgs=noon
  else if(hour<18)msgs=afternoon
  else msgs=evening
  
  const line=msgs[Math.floor(Math.random()*msgs.length)]
  
  let extra=''
  if(state.pets>=50)extra='（这只柴犬已经跟你混得很熟了 🐾）'
  else if(state.pets>=20)extra='（柴犬说它开始喜欢你了 💕）'
  else if(state.pets>=5)extra='（新朋友你好 👋）'
  
  const text=d+' '+line+'\n'+extra+'\n\n你也来戳 👉 '+location.href
  
  // 先显示气泡预览
  const b=document.getElementById('bubble')
  b.classList.remove('show');void b.offsetWidth
  b.innerHTML='📋 已复制！<br><span style=font-size:12px;color:#999>'+line+'</span>'
  b.classList.add('show')
  
  // 复制到剪贴板
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      toast('📋 复制好了，去粘贴吧！')
    }).catch(()=>{
      toast('📋 长按复制这段话发给TA')
    })
  }else{
    // 降级方案：创建临时文本框
    const ta=document.createElement('textarea')
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0'
    document.body.appendChild(ta);ta.select()
    document.execCommand('copy');ta.remove()
    toast('📋 复制好了！')
  }
  playHappy();spawnHearts(5)
}

function spawnPaw(x,y){
  const p=document.createElement('span');p.className='paw';p.textContent='🐾'
  p.style.left=x+'px';p.style.top=y+'px'
  document.body.appendChild(p);setTimeout(()=>p.remove(),3000)
}

function spawnHearts(n){
  const hc=document.getElementById('hearts')
  const emojis=['💕','💖','✨','🌸','💝','🎀','💗','🩷','🌷']
  for(let i=0;i<n;i++)setTimeout(()=>{
    const h=document.createElement('span');h.className='heart'
    h.textContent=emojis[Math.floor(Math.random()*emojis.length)]
    h.style.left=Math.random()*80+10+'%';h.style.top='85%'
    h.style.animationDuration=(1+Math.random()*1.5)+'s'
    hc.appendChild(h);setTimeout(()=>h.remove(),1800)
  },i*60)
}

function spawnConfetti(){
  const emojis=['🎉','🎊','✨','🌟','💫','🎀','🌸','💖']
  for(let i=0;i<30;i++)setTimeout(()=>{
    const c=document.createElement('span');c.className='confetti'
    c.textContent=emojis[Math.floor(Math.random()*emojis.length)]
    c.style.left=Math.random()*100+'%';c.style.top='-20px'
    c.style.setProperty('--cx',(Math.random()*200-100)+'px')
    c.style.setProperty('--cr',(Math.random()*720-360)+'deg')
    document.body.appendChild(c);setTimeout(()=>c.remove(),2200)
  },i*30)
}

function updateStats(){
  document.getElementById('happiness').textContent=state.happiness
  document.getElementById('treats').textContent=state.treats
  document.getElementById('pets').textContent=state.pets
  document.getElementById('treatBadge').textContent=state.treats
  state.happiness=Math.max(0,state.happiness-.5)
}

function switchTheme(t){document.getElementById('body').className=t;toast('✨')}
function toggleMusic(){state.music=!state.music;document.getElementById('musicBtn').textContent=state.music?'🔊':'🔇'}
function showModal(icon,msg){document.getElementById('modalIcon').textContent=icon;document.getElementById('modalMsg').textContent=msg;document.getElementById('modal').classList.add('show')}
function toast(msg){const t=document.getElementById('bubble');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

setInterval(()=>{state.happiness=Math.max(20,state.happiness-.1);updateStats()},10000)
updateStats()
</script>
</body>
</html>
