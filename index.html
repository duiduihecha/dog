<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>戳一下 🐕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;align-items:center;min-height:100dvh;font-family:-apple-system,sans-serif;overflow:hidden;transition:background .5s;cursor:default}
body.day{background:linear-gradient(135deg,#fce4ec,#e8eaf6)}
body.night{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#e0e8f4}
body.sunset{background:linear-gradient(135deg,#ffe0b2,#ffccbc)}
.card{text-align:center;max-width:400px;padding:20px;position:relative;z-index:5}
.dog-container{position:relative;display:inline-block;margin:10px 0}
.dog{font-size:120px;cursor:pointer;transition:transform .15s;user-select:none;display:inline-block;position:relative;z-index:2}
.dog:active{transform:scale(.85)}
.dog.bounce{animation:bounce .4s ease}
.dog.shake{animation:shake .5s ease}
.dog.happy{animation:happy .6s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-28px)}60%{transform:translateY(-10px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes happy{0%{transform:scale(1)}30%{transform:scale(1.15) rotate(-8deg)}60%{transform:scale(1.1) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.paw{position:absolute;font-size:30px;pointer-events:none;animation:pawFade 3s ease-out forwards;z-index:1}
@keyframes pawFade{0%{opacity:.6;transform:scale(.5)}30%{opacity:.3;transform:scale(1)}100%{opacity:0;transform:scale(.8) translateY(20px)}}
.bubble{background:#fff;border-radius:22px;padding:16px 22px;font-size:15px;color:#333;box-shadow:0 4px 24px rgba(0,0,0,.1);margin-top:18px;display:none;animation:popIn .4s ease;line-height:1.7;position:relative}
body.night .bubble{background:#2a2a4a;color:#e0e0f0}
body.sunset .bubble{background:#fff8e1;color:#5d4037}
.bubble.show{display:block}
.bubble::after{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-bottom-color:#fff}
body.night .bubble::after{border-bottom-color:#2a2a4a}
body.sunset .bubble::after{border-bottom-color:#fff8e1}
@keyframes popIn{0%{opacity:0;transform:scale(.7) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.hint{color:#aaa;font-size:12px;margin-top:14px;transition:opacity .3s}
.stats{display:flex;justify-content:center;gap:20px;margin:12px 0;font-size:13px;color:#888;height:20px}
.stat{display:flex;align-items:center;gap:4px}
.stat-val{color:#e91e63;font-weight:700}
.controls{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.btn{font-size:22px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.06);border-radius:50%;width:46px;height:46px;cursor:pointer;transition:all .15s;position:relative}
body.night .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.05)}
.btn:active{transform:scale(.82);background:rgba(255,255,255,.9)}
.btn .badge{position:absolute;top:-6px;right:-6px;background:#e91e63;color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;min-width:18px}
.treat{position:fixed;font-size:28px;pointer-events:none;z-index:50;animation:throwTreat 1.2s ease-in forwards}
@keyframes throwTreat{0%{opacity:1;transform:translate(0,0) rotate(0)}50%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(360deg)}100%{opacity:0;transform:translate(calc(var(--dx)*2),calc(var(--dy)*1.5+60px)) rotate(720deg)}}
.hearts{position:fixed;pointer-events:none;z-index:10}
.heart{position:absolute;font-size:26px;animation:floatUp 1.5s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-160px) scale(.35) rotate(25deg)}}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;display:none}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:30px;text-align:center;max-width:320px;width:90%}
.modal-box h2{font-size:28px;margin-bottom:8px}
.modal-box p{color:#666;font-size:14px;margin-bottom:16px}
.modal-box button{padding:10px 30px;background:#e91e63;color:#fff;border:none;border-radius:20px;font-size:15px;cursor:pointer}
</style>
</head>
<body class="day" id="body">
<div class="card">
  <div class="dog-container" id="dogContainer">
    <div class="dog" onclick="petDog(event)" id="dog">🐕</div>
  </div>
  <div class="bubble" id="bubble"></div>
  <div class="hint">👆 戳柴犬  |  🍖 拖食物给它</div>
  
  <div class="stats">
    <div class="stat">❤️ <span class="stat-val" id="happiness">100</span>%</div>
    <div class="stat">🦴 <span class="stat-val" id="treats">0</span></div>
    <div class="stat">🐾 <span class="stat-val" id="pets">0</span></div>
  </div>
  
  <div class="controls">
    <button class="btn" onclick="switchTheme('day')" title="白天">☀️</button>
    <button class="btn" onclick="switchTheme('sunset')" title="黄昏">🌅</button>
    <button class="btn" onclick="switchTheme('night')" title="晚上">🌙</button>
    <button class="btn" onclick="throwTreat(event)" title="喂食"><span class="badge" id="treatBadge">3</span>🍖</button>
    <button class="btn" onclick="toggleMusic()" title="音乐" id="musicBtn">🔊</button>
  </div>
</div>
<div class="hearts" id="hearts"></div>
<div class="modal" id="modal">
  <div class="modal-box">
    <h2>🎉</h2>
    <p id="modalMsg"></p>
    <button onclick="document.getElementById('modal').classList.remove('show')">知道啦 ✨</button>
  </div>
</div>

<script>
const dogs = ['🐕','🐶','🐩','🦮','🐕‍🦺','🐾']
let state = {happiness:100,treats:3,pets:0,dogIdx:0,music:true}
let audioCtx = null

// 预热 AudioContext（iOS 需要先 resume）
document.addEventListener('click',()=>{
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)()
  if(audioCtx.state==='suspended') audioCtx.resume()
},{once:true})

const msgs = [
  "今天辛苦了，喝杯水休息一下 ☕",
  "你已经很棒了，别给自己太大压力 ✨",
  "工作只是生活的一部分，你才是主角 🌸",
  "这个点还在忙？快起来伸个懒腰 🐱",
  "偷偷告诉你：今天会有好事发生 🌈",
  "没有什么是一顿好吃的解决不了的 🍜",
  "你的努力，时间看得见 💪",
  "今天的你也是满分选手 🥇",
  "摸鱼三分钟，效率翻一倍 🐟",
  "打工人打工魂，打完工再去浪 🌊",
  "全世界都在催你长大我在催你早睡 🌙",
  "你是人间四月天 ☀️",
  "可爱的人连加班都是可爱的 🎀",
  "再坚持一下就周五了 🥲",
  "今天妆容很好看哦 😊",
  "下班后的快乐在等你了 🍻",
  "好运正在派送中，请保持心情通畅 📦",
  "追光的人，自己也会身披光芒 ✨",
  "白天有说有笑，晚上睡个好觉 💤",
  "今天不想上班，明天也不想想 🤪",
]
const treats = ['🍖','🍗','🍩','🧀','🍎','🥩','🍰','🧁']
const achievements = {
  10:{icon:'🌟',msg:'柴犬之友！送你一朵小花'},
  25:{icon:'🏆',msg:'狗狗达人！柴犬想跟你回家了'},
  50:{icon:'👑',msg:'传说级铲屎官！柴犬决定不离不弃'},
}

function playBark(){
  if(!state.music) return
  try{
    if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
    if(audioCtx.state==='suspended') audioCtx.resume()
    const o=audioCtx.createOscillator(),g=audioCtx.createGain()
    o.connect(g);g.connect(audioCtx.destination)
    o.type='sawtooth';o.frequency.setValueAtTime(500,audioCtx.currentTime)
    o.frequency.exponentialRampToValueAtTime(150,audioCtx.currentTime+.2)
    g.gain.setValueAtTime(.2,audioCtx.currentTime)
    g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.25)
    o.start();o.stop(audioCtx.currentTime+.25)
  }catch(e){}
}

function playHappy(){
  if(!state.music) return
  try{
    if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
    if(audioCtx.state==='suspended') audioCtx.resume()
    const notes=[523,659,784]
    notes.forEach((f,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain()
      o.connect(g);g.connect(audioCtx.destination)
      o.type='triangle';o.frequency.value=f
      g.gain.setValueAtTime(.12,audioCtx.currentTime+i*.15)
      g.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.4+i*.15)
      o.start(audioCtx.currentTime+i*.15)
      o.stop(audioCtx.currentTime+.4+i*.15)
    })
  }catch(e){}
}

function petDog(e){
  // 首次点击初始化音频
  if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
  if(audioCtx.state==='suspended') audioCtx.resume()
  
  const dog=document.getElementById('dog')
  const anims=['bounce','shake','happy']
  dog.classList.add(anims[Math.floor(Math.random()*anims.length)])
  setTimeout(()=>{anims.forEach(a=>dog.classList.remove(a))},600)
  
  state.pets++
  updateStats()
  
  if(state.pets % 5 === 0){
    state.treats = Math.min(state.treats+1, 10)
    updateStats()
    spawnHearts(5)
    toast('🎁 +1 狗粮')
  }
  
  const b=document.getElementById('bubble')
  b.classList.remove('show');void b.offsetWidth
  b.textContent = msgs[Math.floor(Math.random()*msgs.length)]
  b.classList.add('show')
  
  spawnHearts(3+Math.floor(Math.random()*4))
  playBark()
  
  // Paw prints near click
  if(e){
    const rect=dog.getBoundingClientRect()
    const x=rect.left+rect.width/2+Math.random()*80-40
    const y=rect.top+Math.random()*40-20
    spawnPaw(x,y)
  }
  
  // Achievements
  if(achievements[state.pets]){
    const a=achievements[state.pets]
    document.getElementById('modalMsg').textContent = a.icon+' '+a.msg
    document.getElementById('modal').classList.add('show')
    playHappy()
    spawnHearts(15)
  }
  
  // Random dog change
  if(state.pets % 12 === 0){
    state.dogIdx=(state.dogIdx+1)%dogs.length
    dog.textContent=dogs[state.dogIdx]
  }
}

function throwTreat(e){
  if(state.treats <= 0){toast('🍖 狗粮不够啦！多戳几下柴犬');return}
  state.treats--
  state.happiness = Math.min(state.happiness+10, 200)
  updateStats()
  
  if(e){
    const t=document.createElement('span')
    t.className='treat'
    t.textContent=treats[Math.floor(Math.random()*treats.length)]
    t.style.left=e.clientX+'px'
    t.style.top=e.clientY+'px'
    t.style.setProperty('--dx',(Math.random()*200-100)+'px')
    t.style.setProperty('--dy',(Math.random()*-120-40)+'px')
    document.body.appendChild(t)
    setTimeout(()=>t.remove(),1300)
  }
  
  const dog=document.getElementById('dog')
  dog.classList.add('happy')
  setTimeout(()=>dog.classList.remove('happy'),600)
  spawnHearts(6)
  playHappy()
}

function spawnPaw(x,y){
  const p=document.createElement('span')
  p.className='paw'
  p.textContent='🐾'
  p.style.left=x+'px'
  p.style.top=y+'px'
  document.body.appendChild(p)
  setTimeout(()=>p.remove(),3000)
}

function spawnHearts(n){
  const hc=document.getElementById('hearts')
  const emojis=['💕','💖','✨','🌸','💝','🎀','💗','🩷','🌷']
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const h=document.createElement('span')
      h.className='heart'
      h.textContent=emojis[Math.floor(Math.random()*emojis.length)]
      h.style.left=Math.random()*80+10+'%'
      h.style.top='85%'
      h.style.animationDuration=(1+Math.random()*1.5)+'s'
      hc.appendChild(h)
      setTimeout(()=>h.remove(),1800)
    },i*60)
  }
}

function updateStats(){
  document.getElementById('happiness').textContent=state.happiness
  document.getElementById('treats').textContent=state.treats
  document.getElementById('pets').textContent=state.pets
  document.getElementById('treatBadge').textContent=state.treats
  state.happiness=Math.max(0,state.happiness-.5)
}

function switchTheme(t){
  document.getElementById('body').className=t
  toast('✨ 切换成功')
}

function toggleMusic(){
  state.music=!state.music
  document.getElementById('musicBtn').textContent=state.music?'🔊':'🔇'
  toast(state.music?'音效已开启 🔊':'音效已关闭')
}

function toast(msg){
  const t=document.getElementById('bubble')
  t.textContent=msg;t.classList.add('show')
  setTimeout(()=>t.classList.remove('show'),1800)
}

// 缓慢消耗开心值
setInterval(()=>{
  state.happiness=Math.max(20,state.happiness-.1)
  updateStats()
},10000)

updateStats()
</script>
</body>
</html>
